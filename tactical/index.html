<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#10130e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Project Sengoku">
  <title>Project Sengoku Tactical B5.3 — Core Integration</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/battle.css">
</head>
<body>
  <div id="orientationGate" class="orientation-gate" aria-live="polite">
    <div class="rotate-icon">↻</div>
    <strong>横向きにしてください</strong>
    <span>Project Sengoku の会戦は横画面でプレイします</span>
  </div>

  <main class="battle-app">
    <div id="battlefieldWrap" class="battlefield-wrap">
      <canvas id="battlefield" width="1600" height="760" aria-label="戦場"></canvas>
      <div id="floatingMessage" class="floating-message" aria-live="polite"></div>
      <div id="gestureBadge" class="gesture-badge" hidden></div>
    </div>

    <header class="combat-topbar" aria-label="会戦情報">
      <div class="speed-controls">
        <button type="button" data-speed="0" class="speed-btn active" aria-label="停止">Ⅱ</button>
        <button type="button" data-speed="1" class="speed-btn">×1</button>
        <button type="button" data-speed="3" class="speed-btn">×3</button>
      </div>
      <div class="battle-center-status">
        <span id="battleStatus">会戦中</span>
        <span class="divider">•</span>
        <span id="timeStatus">停止</span>
      </div>
      <div class="army-status">
        <span class="player-text">自 <b id="playerAlive">7</b></span>
        <span>vs</span>
        <span class="enemy-text">敵 <b id="enemyAlive">7</b></span>
        <button id="menuBtn" type="button" class="icon-btn" aria-label="設定">☰</button>
      </div>
    </header>

    <section id="selectedPanel" class="selected-panel" hidden>
      <div class="selected-main">
        <span id="selectedIcon" class="unit-type-icon">馬</span>
        <div>
          <strong id="detailOfficer">-</strong>
          <span id="detailType">-</span>
        </div>
      </div>
      <div class="selected-bars">
        <span>兵 <b id="detailTroops">-</b></span>
        <span>士 <b id="detailMorale">-</b></span>
        <span id="detailFatigue" class="secondary-stat">速 -</span>
      </div>
      <div id="chargeSuggestion" class="charge-suggestion" hidden>突撃可能</div>
      <div class="micro-actions">
        <button id="waitBtn" type="button">待機</button>
        <button id="retreatBtn" type="button">後退</button>
      </div>
    </section>

    <nav id="roster" class="roster" aria-label="自軍部隊"></nav>
    <button id="rosterToggle" class="roster-toggle" type="button" aria-label="部隊一覧を格納">⌄</button>

    <aside id="menuPanel" class="menu-panel" hidden>
      <div class="menu-head"><strong>B5.3 TEST</strong><button id="menuCloseBtn" type="button">×</button></div>
      <label>Seed <input id="seedInput" inputmode="numeric" value="1597463007"></label>
      <button id="restartBtn" type="button">再戦</button>
      <p>基本操作：部隊をタップして選択。部隊からドラッグして移動。敵へドラッグして攻撃。側面・背面＋助走条件を満たすと突撃候補になります。</p>
      <p>手動Facing：選択部隊を約0.5秒長押しし、そのまま向かせたい方向へ少し動かして離します。</p>
      <div id="resultPanel" hidden><pre id="resultJson"></pre></div>
    </aside>
  </main>

  <script defer src="js/core/rng.js"></script>
  <script defer src="js/core/vec.js"></script>
  <script defer src="js/core/clock.js"></script>
  <script defer src="js/model/unitTypes.js"></script>
  <script defer src="js/model/battleUnit.js"></script>
  <script defer src="js/model/battleState.js"></script>
  <script defer src="js/sim/movement.js"></script>
  <script defer src="js/sim/combat.js"></script>
  <script defer src="js/sim/morale.js"></script>
  <script defer src="js/sim/step.js"></script>
  <script defer src="js/ui/render.js"></script>
  <script defer src="js/ui/input.js"></script>
  <script defer src="js/ui/hud.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/integration/coreBridge.js"></script>
</body>
</html>
