  <style data-source="styles/tokens.css">
:root {
  --bg: #090c12; --panel: #121923; --panel-2: #192332; --line: #344257;
  --text: #f4f0e6; --muted: #9eaaba; --gold: #e2b95c; --gold-2: #f4d486;
  --blue: #4f84e8; --red: #d65353; --green: #55bd78; --danger: #e37974;
  --shadow: 0 22px 65px rgba(0,0,0,.43); --radius: 10px;
  font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
}
  </style>
  <style data-source="styles/base.css">
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
button, select, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .38; }
h1, h2, h3, h4 { font-family: Georgia, "Yu Mincho", serif; }
.hidden { display: none !important; }
.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }
.kicker { margin: 0 0 5px; color: var(--gold); font-size: 10px; font-weight: 900; letter-spacing: .19em; }
.muted { color: var(--muted); }
.good { color: #8cd7a8; }
.bad { color: #e9938e; }
.major { color: #f0cf7a; font-weight: 800; }
.panel { background: rgba(18,25,35,.97); border: 1px solid #2e3b4f; border-radius: var(--radius); box-shadow: var(--shadow); }
.button { border: 1px solid transparent; border-radius: 7px; padding: 11px 16px; font-weight: 900; color: var(--text); }
.button:hover:not(:disabled) { transform: translateY(-1px); }
.button.primary { background: linear-gradient(#e9c56f,#b98631); color: #17110a; }
.button.secondary { background: #192330; border-color: #3b4a60; }
.button.danger { background: #4a2327; border-color: #824047; color: #ffd9d6; }
.wide { width: 100%; }
.text-button { border: 0; background: transparent; color: var(--gold-2); font-weight: 800; }
.badge { padding: 5px 9px; border: 1px solid #40516a; border-radius: 16px; color: #b7c2d0; font-size: 9px; }

.skip-link { position: fixed; left: 12px; top: 12px; z-index: 100; transform: translateY(-180%); padding: 10px 14px; border-radius: 6px; background: #f4d486; color: #17110a; font-weight: 900; }
.skip-link:focus { transform: translateY(0); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--gold-2); outline-offset: 3px; }
kbd { display: inline-block; min-width: 1.8em; padding: 2px 6px; border: 1px solid #627089; border-bottom-width: 2px; border-radius: 4px; background: #0a1018; color: #f4f0e6; text-align: center; font-size: .86em; }
body.large-text { font-size: 118%; }
body.large-text .kicker, body.large-text small, body.large-text .resource span { font-size: .72rem; }
body.high-contrast { --bg: #000; --panel: #080808; --panel-2: #111; --line: #f4d486; --text: #fff; --muted: #e2e2e2; }
body.high-contrast .panel, body.high-contrast .resource, body.high-contrast .choice, body.high-contrast .command, body.high-contrast .modal { border-color: #e8d699; }
body.high-contrast .text-button, body.high-contrast .kicker { color: #ffe788; }
body.reduced-motion *, body.reduced-motion *::before, body.reduced-motion *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
  </style>
  <style data-source="styles/layout.css">
#titleScreen { position: relative; overflow: hidden; background: radial-gradient(circle at 74% 20%,rgba(160,43,31,.3),transparent 28%),radial-gradient(circle at 20% 72%,rgba(35,70,132,.28),transparent 34%),linear-gradient(135deg,#080a0f,#171018 60%,#080b11); }
#titleScreen::after { content: "戦"; position: absolute; right: 3vw; bottom: -18vh; font: 700 min(72vw,760px)/1 serif; color: rgba(255,255,255,.025); transform: rotate(-8deg); }
.title-box { position: relative; z-index: 1; width: min(720px,calc(100vw - 40px)); margin-left: clamp(25px,10vw,150px); padding-top: clamp(90px,18vh,185px); }
.title-box h1 { margin: 0; font: 700 clamp(64px,10vw,140px)/.82 Georgia,"Yu Mincho",serif; letter-spacing: -.06em; text-shadow: 0 12px 35px #000; }
.title-box h1 span { color: var(--gold-2); }
.tagline { margin: 32px 0 28px; color: #c7d0dc; font-size: clamp(17px,2vw,22px); line-height: 1.7; }
.title-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.title-actions .button { min-width: 220px; padding: 16px 24px; }
.version { margin-top: 22px; color: #697688; font-size: 11px; letter-spacing: .12em; }
.topbar { min-height: 84px; padding: 13px clamp(14px,3vw,42px); display: grid; grid-template-columns: 1fr auto 44px; gap: 18px; align-items: center; background: #0b1018; border-bottom: 1px solid #283548; }
.topbar h2 { margin: 0; font-size: 25px; }
.resources { display: flex; gap: 7px; }
.resource { min-width: 72px; padding: 8px 10px; background: #111925; border: 1px solid #2d3a4e; border-radius: 6px; }
.resource span { display: block; color: var(--muted); font-size: 9px; }
.resource strong { font-size: 16px; }
.icon-button { width: 42px; height: 42px; border: 1px solid #36455b; background: #151e29; color: white; border-radius: 7px; font-size: 19px; }
.game-layout { display: grid; grid-template-columns: minmax(610px,1fr) 365px; grid-template-areas: "map side" "council side"; gap: 14px; padding: 14px clamp(14px,3vw,42px) 30px; max-width: 1540px; margin: 0 auto; }
.map-panel { grid-area: map; overflow: hidden; }
.side-panel { grid-area: side; display: flex; flex-direction: column; min-height: 690px; }
.council-panel { grid-area: council; }
.panel-heading { min-height: 65px; padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b384b; }
.panel-heading h3 { margin: 0; font-size: 22px; }
.goal { color: var(--gold-2); font-size: 14px; }
.map-area { position: relative; height: 480px; overflow: hidden; background: radial-gradient(circle at 50% 45%,rgba(83,105,141,.15),transparent 45%),linear-gradient(145deg,#182332,#101722); }
.roads { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.roads line { stroke: #6a7484; stroke-width: 4; stroke-linecap: round; opacity: .65; }
.roads line.front { stroke: #b5904d; stroke-dasharray: 10 8; opacity: .9; }
.map-note { position: absolute; left: 15px; bottom: 14px; max-width: 430px; margin: 0; padding: 10px 12px; background: rgba(7,11,17,.82); border: 1px solid #35435a; border-radius: 6px; color: #c5cfdb; font-size: 11px; line-height: 1.55; }
.log-wrap { margin-top: auto; padding: 14px; }
.event-log { height: 145px; overflow: auto; padding: 9px; background: #080d13; border: 1px solid #29374a; border-radius: 6px; color: #cbd3df; font-size: 10px; line-height: 1.6; }
.event-log div { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.035); }

.guide-panel { max-width: 1540px; margin: 14px auto 0; padding: 0 clamp(14px,3vw,42px); }
.map-scroll-shell { width: 100%; overflow: hidden; }
.mobile-nav { display: none; }
  </style>
  <style data-source="styles/components.css">
.castle { position: absolute; transform: translate(-50%,-50%); width: 132px; padding: 10px; border-radius: 8px; color: white; background: #152033; border: 2px solid currentColor; box-shadow: 0 12px 25px rgba(0,0,0,.38); text-align: center; }
.castle.f-aotsuki { color: #7caaff; background: rgba(23,43,78,.95); }
.castle.f-tokizawa { color: #f07d79; background: rgba(68,28,31,.95); }
.castle.f-yukishiro { color: #78d99a; background: rgba(24,67,45,.95); }
.castle.selected { outline: 3px solid #ffe2a0; outline-offset: 5px; }
.castle.scouted::after { content: "偵察済"; position: absolute; right: -9px; top: -10px; padding: 2px 5px; border-radius: 10px; background: #243044; color: #f3d786; font-size: 8px; }
.castle strong, .castle small { display: block; }
.castle small { margin-top: 4px; color: #dce4ef; font-size: 9px; }
.castle-detail { padding: 14px; }
.castle-title { display: flex; justify-content: space-between; align-items: flex-start; }
.castle-title h3 { margin: 0; font-size: 27px; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 12px 0; }
.stat-grid div { padding: 9px 10px; background: #0c121a; border: 1px solid #29364a; border-radius: 6px; }
.stat-grid span { color: var(--muted); font-size: 9px; }
.stat-grid strong { float: right; }
.officer-line { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid transparent; border-radius: 7px; cursor: pointer; }
.officer-line:hover { background: #202b3a; border-color: #45566f; }
.officer-seal { display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid #526078; border-radius: 50%; color: var(--gold); font: 700 15px serif; }
.officer-line small { display: block; color: var(--muted); }
.command-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.command { min-height: 60px; padding: 8px; background: #16202c; border: 1px solid #334258; border-radius: 7px; color: white; text-align: left; }
.command strong, .command small { display: block; }
.command small { margin-top: 3px; color: var(--muted); font-size: 8px; }
.command.attack { border-color: #704047; }
.end-turn { width: 100%; margin-top: 9px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(#3b2d17,#241c10); border: 1px solid #82642c; border-radius: 7px; color: #f2ce76; }
.end-turn span { font-size: 9px; }
.proposals { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; padding: 12px; }
.proposal { padding: 11px; background: #151e29; border: 1px solid #303e53; border-radius: 7px; }
.proposal h4 { margin: 3px 0 6px; font-size: 16px; }
.proposal p { min-height: 48px; margin: 0; color: #b8c3d1; font-size: 10px; line-height: 1.5; }
.proposal .button { width: 100%; margin-top: 9px; padding: 8px; font-size: 10px; }
.modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.76); backdrop-filter: blur(5px); }
.modal { position: relative; width: min(760px,100%); max-height: 92vh; overflow: auto; padding: 25px; background: #121923; border: 1px solid #45536a; border-radius: 10px; box-shadow: 0 30px 100px #000; }
.modal-close { position: absolute; right: 10px; top: 9px; width: 34px; height: 34px; border: 0; background: transparent; color: #a4b0c1; font-size: 25px; }
.modal h2 { margin: 0 0 10px; font-size: 29px; }
.modal p { color: #bdc7d4; line-height: 1.72; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; flex-wrap: wrap; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { padding: 12px; background: #17212e; border: 1px solid #35445a; border-radius: 7px; color: white; text-align: left; }
.choice strong, .choice small { display: block; }
.choice small { margin-top: 4px; color: #aeb9c7; font-size: 9px; }
.choice:disabled { cursor: not-allowed; opacity: .72; }
.event-view { max-height: 78vh; overflow-y: auto; overscroll-behavior: contain; }
.event-choices { grid-template-columns: 1fr; }
.event-choice:focus-visible { outline: 3px solid #e2b95c; outline-offset: 2px; }
.field { display: block; margin: 11px 0; }
.field span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 9px; }
.field select, .field input, .field textarea { width: 100%; padding: 11px; background: #0f1620; color: white; border: 1px solid #35445a; border-radius: 6px; }
.field textarea { min-height: 180px; font-family: ui-monospace, monospace; font-size: 11px; }
.record { padding: 10px 0; border-bottom: 1px solid #2c394c; }
.record strong { color: var(--gold-2); }
.loyalty-meter { height: 9px; margin: 9px 0; background: #090e15; border: 1px solid #2e3a4d; border-radius: 9px; overflow: hidden; }
.loyalty-meter i { display: block; height: 100%; background: linear-gradient(90deg,#b63f45,#e0b95c 48%,#55bd78); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translate(-50%,15px); opacity: 0; padding: 10px 16px; background: #202a38; border: 1px solid #4b5c73; border-radius: 6px; transition: .2s; pointer-events: none; }
.toast.show { transform: translate(-50%,0); opacity: 1; }
.toast.error { border-color: #a34d55; color: #ffd9d6; }
.debug-panel { position: fixed; z-index: 70; top: 10px; right: 10px; width: min(430px,calc(100vw - 20px)); max-height: calc(100vh - 20px); overflow: auto; padding: 14px; background: rgba(8,12,18,.98); border: 1px solid #7b6530; border-radius: 8px; box-shadow: var(--shadow); }
.debug-panel h3 { margin: 0 0 8px; }
.debug-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.debug-panel pre { max-height: 250px; overflow: auto; padding: 8px; background: #030507; color: #bcd0e5; font-size: 9px; white-space: pre-wrap; }
.diplomacy-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; margin: 12px 0; }
.diplomacy-stats div { padding: 9px; background: #0c121a; border: 1px solid #29364a; border-radius: 6px; }
.diplomacy-stats span,.diplomacy-stats strong { display: block; }
.diplomacy-stats span { color: var(--muted); font-size: 9px; }
.diplomacy-actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin: 12px 0; }
.diplomacy-actions .button { min-height: 52px; text-align: left; }
.diplomacy-actions small { display: block; margin-top: 3px; color: var(--muted); font-size: 8px; }
.diplomacy-actions button:disabled { opacity: .45; cursor: not-allowed; }
.diplomacy-options { margin-top: 12px; padding: 10px; border: 1px solid #35445a; border-radius: 7px; }

.guide-primary { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 16px; border: 1px solid #4d5d76; border-radius: 10px; background: linear-gradient(135deg,rgba(31,44,61,.98),rgba(21,29,41,.98)); box-shadow: var(--shadow); }
.guide-primary strong { display: block; color: var(--gold-2); font-size: 18px; }
.guide-primary p:not(.kicker) { margin: 5px 0 0; color: #c3cedb; line-height: 1.55; font-size: 12px; }
.guide-actions { display: flex; gap: 8px; flex-wrap: wrap; flex: 0 0 auto; }
.tutorial-checklist { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 15px; margin-top: 8px; padding: 10px 14px; border: 1px solid #344257; border-radius: 8px; background: rgba(9,14,21,.93); }
.tutorial-checklist ol { display: flex; gap: 8px 14px; flex-wrap: wrap; margin: 0; padding: 0; list-style: none; }
.tutorial-checklist li { color: #c4ceda; font-size: 10px; }
.tutorial-checklist li span { display: inline-block; width: 18px; color: #7f8b9c; }
.tutorial-checklist li.done { color: #85d8a2; text-decoration: line-through; text-decoration-thickness: 1px; }
.tutorial-checklist li.done span { color: #85d8a2; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.help-grid section, details { padding: 12px; border: 1px solid #344257; border-radius: 8px; background: #0d141e; }
.help-grid h3 { margin-top: 0; }
details { margin-top: 9px; }
summary { cursor: pointer; color: var(--gold-2); font-weight: 900; }
.glossary { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; }
.glossary dt { color: var(--gold-2); font-weight: 900; }
.glossary dd { margin: 0; color: #bec9d6; }
.settings-list { display: grid; gap: 8px; margin: 14px 0; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px; border: 1px solid #344257; border-radius: 8px; background: #0d141e; }
.toggle-row span { display: block; }
.toggle-row strong, .toggle-row small { display: block; }
.toggle-row small { margin-top: 4px; color: var(--muted); }
.toggle-row input { width: 24px; height: 24px; flex: 0 0 auto; accent-color: var(--gold); }
.setup-guide-toggle { margin: 11px 0; }
.officer-line { width: 100%; background: transparent; color: inherit; text-align: left; }
.officer-line > span:last-child { min-width: 0; }
.mobile-nav button[aria-current="page"] { color: var(--gold-2); border-color: var(--gold); }

/* Core v1.0 final readability */
.modal, .record, .proposal, .choice, .guide-primary { overflow-wrap: anywhere; }
.modal pre { max-width: 100%; overflow: auto; }
.ending-stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; margin: 16px 0; }
.ending-stats div { min-width: 0; padding: 11px; border: 1px solid #344257; border-radius: 8px; background: #0d141e; }
.ending-stats span, .ending-stats strong { display: block; }
.ending-stats span { color: var(--muted); font-size: 9px; }
.ending-stats strong { margin-top: 4px; color: var(--gold-2); }
:focus-visible { outline: 3px solid #e2b95c; outline-offset: 2px; }

/* Playable Loop Phase 2: mobile-first Army Marching */
.army-layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.army-marker { position: absolute; transform: translate(-50%,-50%); min-width: 112px; min-height: 52px; padding: 7px 9px 7px 34px; border: 2px solid #e6c76e; border-radius: 10px; background: rgba(27,31,39,.96); color: #fff5d6; text-align: left; box-shadow: 0 12px 28px rgba(0,0,0,.48); pointer-events: auto; z-index: 8; }
.army-marker.player { border-color: #f0cf7a; background: linear-gradient(145deg,rgba(55,45,23,.98),rgba(24,29,38,.98)); }
.army-marker.enemy { border-color: #e16f6b; }
.army-marker strong, .army-marker small { display: block; white-space: nowrap; }
.army-marker strong { font-size: 11px; }
.army-marker small { margin-top: 2px; color: #d7dce4; font-size: 8px; }
.army-flag { position: absolute; left: 8px; top: 9px; display: grid; place-items: center; width: 20px; height: 30px; background: #e0b95c; color: #17110a; font: 900 12px serif; clip-path: polygon(0 0,100% 0,100% 74%,50% 100%,0 74%); }
.army-summary-strip { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; margin: 12px 0; }
.army-summary-strip span { min-width: 0; padding: 9px; border: 1px solid #344257; border-radius: 7px; background: #0d141e; color: var(--muted); font-size: 9px; }
.army-summary-strip strong { display: block; margin-top: 4px; color: var(--gold-2); font-size: 13px; overflow-wrap: anywhere; }
.army-unit-builder { display: grid; gap: 9px; margin: 12px 0; }
.army-unit-card { padding: 11px; border: 1px solid #344257; border-radius: 9px; background: #0d141e; }
.army-unit-card.commander { border-color: #876b2d; background: linear-gradient(145deg,#17160f,#0d141e); }
.army-unit-card .field { margin: 7px 0; }
.army-unit-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.army-detail-units { display: grid; gap: 0; }


/* Playable Loop Phase 3: Domestic MVP */
.domestic-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
.domestic-economy-strip { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 7px; margin: 10px 0 12px; }
.domestic-economy-strip span { min-width: 0; padding: 8px 9px; border: 1px solid #3b4659; border-radius: 7px; background: linear-gradient(145deg,#101923,#0a1119); color: var(--muted); font-size: 8px; }
.domestic-economy-strip strong { display: block; margin-top: 3px; color: var(--gold-2); font-size: 12px; overflow-wrap: anywhere; }
.army-cost-strip { margin-top: 8px; }
.army-upkeep-hint { padding: 9px 10px; border-left: 3px solid #8b6e31; background: rgba(50,41,21,.38); border-radius: 5px; }

/* Phase 4: full-screen mobile Tactical Battle boundary */
.tactical-overlay { position: fixed; inset: 0; z-index: 3000; width: 100vw; height: 100dvh; background: #080b0d; padding: 0; margin: 0; }
.tactical-overlay.hidden { display: none !important; }
.tactical-overlay iframe { width: 100%; height: 100%; border: 0; display: block; background: #10130e; }
body.tactical-open { overflow: hidden; touch-action: none; }
.army-marker.in-battle { z-index: 12; box-shadow: 0 0 0 2px rgba(221,179,79,.65), 0 0 22px rgba(221,93,63,.55); }
.army-marker.in-battle .army-flag { animation: tacticalPulse 1.1s ease-in-out infinite alternate; }
@keyframes tacticalPulse { from { transform: scale(.94); } to { transform: scale(1.08); } }

/* Phase 5 — Siege / occupation loop */
.army-marker.besieging { z-index: 13; border-color: #e29c45; box-shadow: 0 0 0 2px rgba(226,156,69,.4), 0 0 24px rgba(202,79,42,.5); }
.army-marker.besieging .army-flag { background: #d96a3d; color: #fff6e7; animation: siegePulse 1.25s ease-in-out infinite alternate; }
@keyframes siegePulse { from { transform: translateY(0) scale(.96); } to { transform: translateY(-2px) scale(1.06); } }
.siege-status-card, .siege-result { margin: 10px 0; padding: 11px 12px; border: 1px solid #805d2b; border-radius: 9px; background: linear-gradient(145deg,rgba(62,39,22,.9),rgba(18,21,27,.98)); }
.siege-status-card strong, .siege-result strong { color: #f2d38a; }
.siege-status-card p, .siege-result p { margin: 6px 0; }
.siege-status-card small, .siege-result small { color: #d9c8a5; }
.siege-meter { height: 8px; margin: 8px 0; overflow: hidden; border: 1px solid #4c3d2a; border-radius: 999px; background: #090c10; }

  <script data-source="src/namespace.js">
(function (global) {
  "use strict";
  var S = global.Sengoku = global.Sengoku || {};
  ["Data", "State", "Systems", "UI", "Save", "Debug", "Util", "Config"].forEach(function (name) {
    S[name] = S[name] || {};
  });
  S.Debug.errors = S.Debug.errors || [];
  S.Util.deepClone = function (value) { return JSON.parse(JSON.stringify(value)); };
  S.Util.clamp = function (value, min, max) { return Math.max(min, Math.min(max, value)); };
  S.Util.assert = function (condition, message) {
    if (!condition) throw new Error(message || "Assertion failed");
    return true;
  };
  S.Util.logError = function (error, context) {
    var item = {
      at: new Date().toISOString(),
      context: context || "unknown",
      message: error && error.message ? error.message : String(error),
      stack: error && error.stack ? error.stack : ""
    };
    S.Debug.errors.push(item);
    if (S.Debug.errors.length > 50) S.Debug.errors.shift();
    if (global.console && console.error) console.error("[Sengoku] " + item.context, error);
    return item;
  };
  S.Util.safeExecute = function (label, callback) {
    try { return callback(); }
    catch (error) {
      S.Util.logError(error, label);
      var recovered = S.Save && S.Save.restoreRuntimeCheckpoint ? S.Save.restoreRuntimeCheckpoint() : null;
      if (S.UI && S.UI.notify) S.UI.notify(recovered && recovered.ok ? "処理エラーを検出し、直前の正常状態へ復旧しました。" : "処理に失敗しました。ゲームは継続できます。", "error");
      return { ok: false, recovered: Boolean(recovered && recovered.ok), errors: [error.message || String(error)] };
    }
  };
  global.addEventListener("error", function (event) { S.Util.logError(event.error || event.message, "window.onerror"); });
  global.addEventListener("unhandledrejection", function (event) { S.Util.logError(event.reason, "unhandledrejection"); });
})(window);
  </script>

  }

    var playerFactionId = scenario.selectableFactionIds.indexOf(options.playerFactionId) >= 0 ? options.playerFactionId : scenario.defaultPlayerFactionId;
    var factionData = S.Data.factions.filter(function (item) { return scenario.factionIds.indexOf(item.id) >= 0; });

      item("aid", available.gold + available.food >= C.aid.minimum, "予約済みを除く資源が不足"), item("prisoner_exchange", true, "交換対象が必要"), item("surrender", status === "war", "戦争中ではありません"), item("vassalage", !state.diplomacy.vassalage[targetId], "すでに従属中")

  <script data-source="src/systems/releaseSystem.js">
(function (S) {
  "use strict";
  var R = S.Systems.Release = {};

  function difficulty(state) { return S.Data.getDifficulty(state.campaign.difficultyId); }
  function clamp(value, minimum, maximum) { return Math.max(minimum, Math.min(maximum, value)); }

  R.castleCounts = function (state) {
    var counts = {};
    Object.keys(state.factions || {}).forEach(function (id) { counts[id] = 0; });
    Object.keys(state.castles || {}).forEach(function (id) {
      var factionId = state.castles[id].factionId;
      if (Object.prototype.hasOwnProperty.call(counts, factionId)) counts[factionId] += 1;
    });
    return counts;
  };

  R.rankings = function (state) {
    var counts = R.castleCounts(state);
    return Object.keys(counts).filter(function (id) {
      return state.factions[id] && state.factions[id].alive;
    }).map(function (id) {
      return { factionId: id, castles: counts[id], power: S.Systems.Diplomacy.power(state, id) };
    }).sort(function (a, b) {
      if (b.castles !== a.castles) return b.castles - a.castles;
      return b.power - a.power;
    });
  };

  R.isDominant = function (state, factionId) {
    var ranking = R.rankings(state), current = ranking.find(function (item) { return item.factionId === factionId; });
    if (!current || current.castles < 4 || ranking.length < 2) return false;
    return current.castles >= Math.ceil(Object.keys(state.castles).length / 2) || current.castles >= ranking[1].castles + 3;
  };

  R.isTrailing = function (state, factionId) {
    var counts = R.castleCounts(state), alive = Object.keys(state.factions).filter(function (id) { return state.factions[id].alive; });
    if (!state.factions[factionId] || !state.factions[factionId].alive || !alive.length) return false;
    var values = alive.map(function (id) { return counts[id]; });
    var minimum = Math.min.apply(null, values), maximum = Math.max.apply(null, values);
    if (minimum === maximum) return false;
    return counts[factionId] <= 1 || counts[factionId] === minimum;
  };

  R.aiEconomyMultiplier = function (state, factionId) {
    var profile = difficulty(state), modifier = profile.aiEconomy;
    if (R.isDominant(state, factionId)) modifier *= profile.dominantEconomyModifier;
    else if (R.isTrailing(state, factionId)) modifier *= profile.trailingEconomyModifier;
    return clamp(modifier, 0.65, 1.45);
  };

  R.aiRecruitMultiplier = function (state, factionId) {
    var profile = difficulty(state), modifier = profile.aiRecruit;
    if (R.isDominant(state, factionId)) modifier *= profile.dominantRecruitModifier;
    else if (R.isTrailing(state, factionId)) modifier *= profile.trailingRecruitModifier;
    return clamp(modifier, 0.70, 1.45);
  };

  R.aiActionCount = function (state, factionId, random) {
    var rng = random || Math.random, profile = difficulty(state);
    var minimum = Number.isInteger(profile.aiActionsMin) ? profile.aiActionsMin : S.Config.Balance.aiActionsMin;
    var maximum = Number.isInteger(profile.aiActionsMax) ? profile.aiActionsMax : S.Config.Balance.aiActionsMax;
    var count = minimum + Math.floor(rng() * (maximum - minimum + 1));
    if (profile.extraActionChance > 0 && rng() < profile.extraActionChance) count += 1;
    if (R.isTrailing(state, factionId) && S.Systems.Diplomacy.warsFor(state, factionId).length) count = Math.max(count, 2);
    if (R.isDominant(state, factionId)) count = Math.min(count, 2);
    return clamp(count, 1, 3);
  };

  R.attackThreshold = function (state, factionId, targetFactionId) {
    var profile = difficulty(state), threshold = S.Config.Balance.aiAttackThreshold / profile.aiAttack;
    var wars = S.Systems.Diplomacy.warsFor(state, factionId);
    if (wars.indexOf(targetFactionId) >= 0) threshold -= 0.035;
    var stagnation = state.diplomacy && state.diplomacy.stagnation ? state.diplomacy.stagnation.seasons : 0;
    threshold -= Math.min(profile.stagnationThresholdReductionMax, stagnation * profile.stagnationThresholdReductionPerSeason);
    if (targetFactionId === state.campaign.playerFactionId && state.campaign.turn <= profile.openingProtectionTurns) threshold += profile.openingAttackThresholdBonus;
    if (R.isDominant(state, factionId)) threshold += 0.045;
    if (R.isTrailing(state, factionId)) threshold -= 0.035;
    var counts = R.castleCounts(state);
    if (counts[targetFactionId] === 1 && counts[factionId] >= 2) threshold -= 0.025;
    return clamp(threshold, profile.minimumAttackThreshold, 1.30);
  };

  R.commitRatio = function (state) {
    return difficulty(state).aiCommitRatio;
  };

  R.maxPlayerAttacksPerSeason = function (state) {
    return difficulty(state).maxPlayerAttacksPerSeason;
  };

  R.battleModifier = function (state, factionId, role, opponentFactionId) {
    var profile = difficulty(state), modifier = 1;
    if (role === "defender" && factionId === state.campaign.playerFactionId && opponentFactionId !== factionId && state.campaign.turn <= profile.openingProtectionTurns) modifier *= profile.openingDefenseModifier;
    if (role === "attacker" && R.isDominant(state, factionId)) modifier *= profile.dominantAttackModifier;
    if (role === "defender" && R.isTrailing(state, factionId)) modifier *= profile.trailingDefenseModifier;
    return modifier;
  };

  R.snapshot = function (state) {
    var profile = difficulty(state), rankings = R.rankings(state), counts = R.castleCounts(state);
    return {
      release: "core-v1.0-rc1",
      difficultyId: profile.id,
      turn: state.campaign.turn,
      openingProtectionRemaining: Math.max(0, profile.openingProtectionTurns - state.campaign.turn),
      stagnationSeasons: state.diplomacy.stagnation.seasons,
      rankings: rankings,
      playerCastles: counts[state.campaign.playerFactionId] || 0,
      dominantFactionId: rankings.length && R.isDominant(state, rankings[0].factionId) ? rankings[0].factionId : null,
      validation: R.validate(state)
    };
  };

  R.validate = function (state) {
    var profile = difficulty(state), errors = [];
    ["aiEconomy", "aiRecruit", "aiAttack", "aiBattle", "minimumAttackThreshold", "aiCommitRatio", "openingDefenseModifier"].forEach(function (key) {
      if (!Number.isFinite(profile[key]) || profile[key] <= 0) errors.push("難易度設定が不正です: " + key);
    });
    if (!Number.isInteger(profile.openingProtectionTurns) || profile.openingProtectionTurns < 0) errors.push("序盤保護期間が不正です");
    if (!Number.isInteger(profile.maxPlayerAttacksPerSeason) || profile.maxPlayerAttacksPerSeason < 1) errors.push("対プレイヤー攻撃上限が不正です");
    var rankings = R.rankings(state);
    if (rankings.some(function (item) { return !Number.isFinite(item.power) || item.castles < 0; })) errors.push("勢力評価が不正です");
    return { ok: errors.length === 0, errors: errors };
  };
})(window.Sengoku);
  </script>
  <script data-source="src/systems/domesticSystem.js">
(function (S) {
  "use strict";
  var D = S.Systems.Domestic = {};

  function cfg() { return S.Config.Balance.domestic; }
  function validate(state, castleId, officerId, options) {
    options = options || {};
    var castle = state.castles[castleId], officer = state.officers[officerId];
    if (!castle || castle.factionId !== state.campaign.playerFactionId) return "自勢力の城を選択してください";
    if (!officer || officer.status !== "active" || officer.factionId !== state.campaign.playerFactionId || officer.castleId !== castleId) return "この城で命令できる武将ではありません";
    if (officer.assignment && officer.assignment.type === "army") return "出陣中の武将は内政命令を実行できません";
    if (options.consumeCommand !== false && state.campaign.commands <= 0) return "命令回数がありません";
    return null;
  }
  function done(state, officer, message, changes, options) {
    options = options || {};
    if (options.consumeCommand !== false) state.campaign.commands -= 1;
    officer.exp += 10;
    officer.fatigue = Math.min(100, officer.fatigue + 10);
    S.Systems.Officer.gainMerit(state, officer.id, 7, message);
    S.Systems.Event.addLog(state, message, "good");
    return { ok: true, stateChanges: Object.assign({ commands: state.campaign.commands }, changes || {}), messages: [message], chronicleEntries: [], errors: [] };
  }
  function accountFor(state, factionId) {
    if (factionId === state.campaign.playerFactionId) return state.campaign;
    return state.factions[factionId];
  }
  function castlesFor(state, factionId) {
    return Object.keys(state.castles).map(function (id) { return state.castles[id]; }).filter(function (castle) { return castle.factionId === factionId; });
  }
  function activeArmiesFor(state, factionId) {
    return Object.keys(state.armies || {}).map(function (id) { return state.armies[id]; }).filter(function (army) { return army && army.factionId === factionId && army.status !== "disbanded"; });
  }


  D.castleProfile = function (castle) {
    return S.Data.getCastleProfile ? S.Data.getCastleProfile(castle) : { type: "城", title: "地方拠点", icon: "城", description: "", tags: [], modifiers: { gold: 1, food: 1, populationGrowth: 1, siegeDefense: 0, march: 1 } };
  };
  D.assignmentEffects = function (state, castle) {
    var governor = castle && castle.governorId ? state.officers[castle.governorId] : null;
    var domesticOfficer = castle && S.Systems.Officer.domesticOfficerAt ? S.Systems.Officer.domesticOfficerAt(state, castle.id) : null;
    var governorPolitics = governor && governor.stats ? governor.stats.politics : 0;
    var governorLeadership = governor && governor.stats ? governor.stats.leadership : 0;
    var domesticPolitics = domesticOfficer && domesticOfficer.stats ? domesticOfficer.stats.politics : 0;
    return {
      governorId: governor && governor.id || null,
      domesticOfficerId: domesticOfficer && domesticOfficer.id || null,
      goldMultiplier: Math.min(1.30, 1 + governorPolitics * 0.00045 + domesticPolitics * 0.00145),
      foodMultiplier: Math.min(1.20, 1 + governorPolitics * 0.00020 + domesticPolitics * 0.00075),
      populationMultiplier: Math.min(1.18, 1 + governorPolitics * 0.00025 + domesticPolitics * 0.00070),
      defenseBonus: Math.max(0, Math.round(governorLeadership / 18))
    };
  };
  D.effectiveGoldYieldForCastle = function (state, castle) {
    var base = D.goldYieldForCastle(castle), profile = D.castleProfile(castle), assignments = D.assignmentEffects(state, castle);
    return Math.max(0, Math.round(base * (profile.modifiers.gold || 1) * assignments.goldMultiplier));
  };
  D.effectiveFoodYieldForCastle = function (state, castle) {
    var base = D.foodYieldForCastle(castle), profile = D.castleProfile(castle), assignments = D.assignmentEffects(state, castle);
    return Math.max(0, Math.round(base * (profile.modifiers.food || 1) * assignments.foodMultiplier));
  };
  D.populationGrowthForCastle = function (state, castle) {
    var profile = D.castleProfile(castle), assignments = D.assignmentEffects(state, castle);
    var base = cfg().populationGrowthBase + Math.floor(castle.population * cfg().populationGrowthRate);
    return Math.max(0, Math.round(base * (profile.modifiers.populationGrowth || 1) * assignments.populationMultiplier));
  };

  D.defaultPopulation = function (castle) {
    var c = cfg(), guard = Number.isFinite(castle.guardTroops) ? castle.guardTroops : castle.troops;
    return Math.max(c.minPopulation, Math.floor((castle.income || 0) * c.populationPerIncome + Math.max(0, guard || 0) * c.populationPerGuardTroop));
  };
  D.defaultAgriculture = function (castle) {
    return Math.max(1, Math.min(cfg().agricultureMax, Math.floor((castle.income || 0) / 4)));
  };
  D.recruitmentCapacity = function (castle) {
    var population = Math.max(0, Math.floor(Number(castle.population) || 0));
    return Math.max(S.Config.MIN_GARRISON, Math.floor(population / cfg().recruitmentPopulationDivisor));
  };
  D.recruitmentRoom = function (castle) {
    var guard = Number.isFinite(castle.guardTroops) ? castle.guardTroops : castle.troops;
    return Math.max(0, D.recruitmentCapacity(castle) - Math.max(0, guard || 0));
  };
  D.goldYieldForCastle = function (castle) {
    return Math.max(0, Math.floor(castle.income || 0)) + Math.floor(Math.max(0, castle.population || 0) / cfg().taxPopulationDivisor);
  };
  D.foodYieldForCastle = function (castle) {
    return cfg().foodBasePerCastle + Math.max(0, Math.floor(castle.agriculture || 0)) * cfg().foodPerAgriculture;
  };
  D.upkeepForArmy = function (state, armyOrId) {
    var army = typeof armyOrId === "string" ? S.Systems.Army.get(state, armyOrId) : armyOrId;
    if (!army || army.status === "disbanded") return { gold: 0, food: 0, troops: 0 };
    var troops = S.Systems.Army.totalTroops(state, army), c = cfg();
    return { troops: troops, gold: troops > 0 ? Math.ceil(troops / c.armyUpkeepGoldDivisor) : 0, food: troops > 0 ? Math.ceil(troops / c.armyUpkeepFoodDivisor) : 0 };
  };
  D.armyUpkeepForFaction = function (state, factionId) {
    return activeArmiesFor(state, factionId).reduce(function (total, army) {
      var cost = D.upkeepForArmy(state, army);
      total.gold += cost.gold; total.food += cost.food; total.troops += cost.troops; total.armies += 1;
      return total;
    }, { gold: 0, food: 0, troops: 0, armies: 0 });
  };
  D.seasonYieldForFaction = function (state, factionId, economyModifier) {
    var modifier = Number.isFinite(economyModifier) ? economyModifier : 1, castles = castlesFor(state, factionId);
    return {
      gold: Math.max(0, Math.round(castles.reduce(function (sum, castle) { return sum + D.effectiveGoldYieldForCastle(state, castle); }, 0) * modifier)),
      food: Math.max(0, Math.round(castles.reduce(function (sum, castle) { return sum + D.effectiveFoodYieldForCastle(state, castle); }, 0) * modifier)),
      castles: castles.length
    };
  };
  D.processFactionSeasonEconomy = function (state, factionId, options) {
    options = options || {};
    var account = accountFor(state, factionId);
    if (!account) return { ok: false, errors: ["勢力資源が見つかりません"] };
    var yieldValue = D.seasonYieldForFaction(state, factionId, options.economyModifier), upkeep = D.armyUpkeepForFaction(state, factionId);
    account.gold += yieldValue.gold;
    account.food += yieldValue.food;
    var goldPaid = Math.min(account.gold, upkeep.gold), foodPaid = Math.min(account.food, upkeep.food);
    account.gold -= goldPaid; account.food -= foodPaid;
    var shortageGold = upkeep.gold - goldPaid, shortageFood = upkeep.food - foodPaid;
    if (shortageGold > 0 || shortageFood > 0) {
      var penalty = (shortageGold > 0 ? cfg().shortageMoraleGold : 0) + (shortageFood > 0 ? cfg().shortageMoraleFood : 0);
      activeArmiesFor(state, factionId).forEach(function (army) {
        (army.unitIds || []).forEach(function (unitId) {
          var unit = S.Systems.Unit.get(state, unitId);
          if (unit && unit.status !== "destroyed") unit.morale = Math.max(0, unit.morale - penalty);
        });
      });
      if (factionId === state.campaign.playerFactionId && S.Systems.Event) S.Systems.Event.addLog(state, "遠征軍の維持物資が不足し、軍勢の士気が低下しました。", "bad");
    }
    castlesFor(state, factionId).forEach(function (castle) {
      var growth = D.populationGrowthForCastle(state, castle);
      castle.population = Math.max(0, Math.floor(castle.population + growth));
    });
    return { ok: true, stateChanges: { factionId: factionId, income: yieldValue, upkeep: upkeep, paid: { gold: goldPaid, food: foodPaid }, shortage: { gold: shortageGold, food: shortageFood }, resources: { gold: account.gold, food: account.food } }, messages: [], errors: [] };
  };
  D.processSeasonEconomy = function (state, options) {
    options = options || {};
    var difficulty = options.difficulty || S.Data.getDifficulty(state.campaign.difficultyId), results = [];
    Object.keys(state.factions).forEach(function (factionId) {
      if (!state.factions[factionId].alive) return;
      var modifier = factionId === state.campaign.playerFactionId ? 1 : (S.Systems.Release ? S.Systems.Release.aiEconomyMultiplier(state, factionId) : difficulty.aiEconomy);
      var result = D.processFactionSeasonEconomy(state, factionId, { economyModifier: modifier });
      results.push(result.stateChanges);
    });
    return { ok: true, stateChanges: { factions: results }, messages: [], errors: [] };
  };

  D.executeDevelopment = function (state, castleId, officerId, options) {
    options = options || {};
    var error = validate(state, castleId, officerId, options), castle = state.castles[castleId], officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    if (state.campaign.gold < S.Config.Balance.develop.gold) return { ok: false, errors: ["金が不足しています"] };
    var roleBoost = S.Systems.Officer.assignment(officer).type === "domestic" ? 1 : 0;
    var gain = 2 + Math.floor(officer.stats.politics / 35) + roleBoost, populationGain = 15 + Math.floor(officer.stats.politics / 3) + roleBoost * 8;
    state.campaign.gold -= S.Config.Balance.develop.gold;
    castle.income += gain; castle.population += populationGain;
    return done(state, officer, officer.name + "が" + castle.name + "の町を整え、収入が" + gain + "、人口が" + populationGain + "増加しました。", { income: castle.income, population: castle.population, gold: state.campaign.gold }, options);
  };
  D.executeCultivation = function (state, castleId, officerId, options) {
    options = options || {};
    var error = validate(state, castleId, officerId, options), castle = state.castles[castleId], officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    if (state.campaign.gold < S.Config.Balance.cultivate.gold) return { ok: false, errors: ["金が不足しています"] };
    if (castle.agriculture >= cfg().agricultureMax) return { ok: false, errors: ["農業はこれ以上開発できません"] };
    var roleBoost = S.Systems.Officer.assignment(officer).type === "domestic" ? 10 : 0;
    var populationGain = 20 + Math.floor(officer.stats.politics / 4) + roleBoost;
    state.campaign.gold -= S.Config.Balance.cultivate.gold;
    castle.agriculture = Math.min(cfg().agricultureMax, castle.agriculture + 1);
    castle.population += populationGain;
    return done(state, officer, officer.name + "が" + castle.name + "で開墾を進め、農業が1、人口が" + populationGain + "増加しました。", { agriculture: castle.agriculture, population: castle.population, gold: state.campaign.gold, foodYield: D.foodYieldForCastle(castle) }, options);
  };
  D.executeRecruitment = function (state, castleId, officerId, options) {
    options = options || {};
    var error = validate(state, castleId, officerId, options), castle = state.castles[castleId], officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    if (state.campaign.gold < S.Config.Balance.recruit.gold || state.campaign.food < S.Config.Balance.recruit.food) return { ok: false, errors: ["金または兵糧が不足しています"] };
    var room = D.recruitmentRoom(castle);
    if (room <= 0) return { ok: false, errors: ["人口に対して守備兵が上限に達しています。町を発展させて人口を増やしてください"] };
    var exhaustion = state.diplomacy.warExhaustion[state.campaign.playerFactionId] || 0;
    var requested = Math.max(1, Math.round((18 + Math.floor(officer.stats.leadership / 12)) * (1 - exhaustion / 100 * S.Data.diplomacy.exhaustion.recruitPenaltyMax)));
    var populationLimit = Math.floor(castle.population / cfg().populationPerRecruit), gain = Math.min(requested, room, populationLimit);
    if (gain <= 0) return { ok: false, errors: ["徴兵できる人口がありません"] };
    state.campaign.gold -= S.Config.Balance.recruit.gold;
    state.campaign.food -= S.Config.Balance.recruit.food;
    castle.population = Math.max(0, castle.population - gain * cfg().populationPerRecruit);
    S.Systems.Unit.changeGuardTroops(state, castle, gain);
    return done(state, officer, officer.name + "が" + castle.name + "で" + gain + "の兵を集めました。人口から兵へ編成されています。", { troops: castle.troops, population: castle.population, recruitmentCapacity: D.recruitmentCapacity(castle) }, options);
  };
  D.executeTraining = function (state, castleId, officerId, options) {
    options = options || {};
    var error = validate(state, castleId, officerId, options), castle = state.castles[castleId], officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    if (state.campaign.food < S.Config.Balance.train.food) return { ok: false, errors: ["兵糧が不足しています"] };
    var gain = 12 + Math.floor(officer.stats.leadership / 25);
    state.campaign.food -= S.Config.Balance.train.food;
    castle.morale = Math.min(100, castle.morale + gain);
    return done(state, officer, officer.name + "が兵を鍛え、士気が" + gain + "上昇しました。", { morale: castle.morale }, options);
  };
  D.executeRest = function (state, castleId, officerId, options) {
    options = options || {};
    var error = validate(state, castleId, officerId, options), officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    var result = S.Systems.Officer.rest(state, officerId);
    if (!result.ok) return result;
    if (options.consumeCommand !== false) state.campaign.commands -= 1;
    S.Systems.Event.addLog(state, officer.name + "が休養しました。", "good");
    return { ok: true, stateChanges: result.stateChanges, messages: [officer.name + "が休養しました。"], errors: [] };
  };
  D.executeScout = function (state, sourceId, targetId, officerId, options) {
    options = options || {};
    var error = validate(state, sourceId, officerId, options), source = state.castles[sourceId], target = state.castles[targetId], officer = state.officers[officerId];
    if (error) return { ok: false, errors: [error] };
    if (!target || source.neighbors.indexOf(targetId) < 0 || target.factionId === state.campaign.playerFactionId) return { ok: false, errors: ["隣接する敵城を選んでください"] };
    if (state.campaign.gold < S.Config.Balance.scout.gold) return { ok: false, errors: ["金が不足しています"] };
    state.campaign.gold -= S.Config.Balance.scout.gold;
    state.events.intel[targetId] = 3;
    if (officer.goal && officer.id === "soma") { officer.goal.flags.scouted = true; officer.goal.progress = Math.max(officer.goal.progress, 1); }
    return done(state, officer, officer.name + "が" + target.name + "の兵力を偵察しました。", { targetId: targetId }, options);
  };
})(window.Sengoku);

  <script data-source="src/systems/orderSystem.js">
(function (S) {
  "use strict";
  var O = S.Systems.Orders = {};

  var DOMESTIC_LABELS = {
    develop: "商業投資",

(function (S) {
  "use strict";
  var V = S.Systems.Victory = {};

          var army = state.armies[armyId];

          (army.unitIds || []).slice().forEach(function (unitId) {
            if (state.units && state.units[unitId]) S.Systems.Unit.remove(state, unitId);
          });
          delete state.armies[armyId];
        });
        Object.keys(state.officers).forEach(function (officerId) { var officer = state.officers[officerId]; if (officer.factionId === id && officer.status === "active") { S.Systems.Officer.clearGovernorAssignments(state, officerId, null); officer.status = "ronin"; officer.castleId = null; officer.assignment = { type: "idle", castleId: null, armyId: null }; S.Systems.Officer.remember(state, officerId, faction.name + "の滅亡により浪人となった。", true); } });
        var message = faction.name + "は領国を失い、滅亡しました。"; S.Systems.Event.addChronicle(state, message); S.Systems.Event.addLog(state, message, "major");
      }

    return eliminated;
  };
  V.check = function (state) {

    else if (!state.campaign.gameOver && (holdings >= total || !otherAlive || hegemony)) { state.campaign.gameOver = true; state.campaign.outcome = "victory"; S.Systems.Event.addChronicle(state, state.factions[playerId].name + (hegemony ? "は諸勢力を従え、覇権を確立しました。" : "は全" + total + "城を制し、天下統一を成し遂げました。")); }

  <script data-source="src/systems/siegeSystem.js">
(function (S) {
  "use strict";
  var G = S.Systems.Siege = {};

  function fail(message) { return { ok: false, errors: [message] }; }
  function cfg() {
    return (S.Config.Balance && S.Config.Balance.siege) || {
      tacticalThreshold: 0.9,
      continuationThreshold: 0.78,
      fortificationPerLevel: 12,
      moraleWeight: 0.08,
      attackerMoraleBase: 0.75,
      attackerMoraleDivisor: 400,
      breachTroopRatio: 0.2,
      breachMinDamage: 2,
      moraleDamage: 6,
      defenseDamageEvery: 2

  }
  function seeded(seed) {
    var x = (Number(seed) || 1) >>> 0;
    return function () { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  }
  function avgArmyMorale(state, army) {
    var values = (army.unitIds || []).map(function (unitId) { return S.Systems.Unit.get(state, unitId); }).filter(function (unit) { return unit && unit.status !== "destroyed" && unit.troops > 0; });

  }

      report.siegeDefenseScore = preview.defenseScore;

  }

  G.preview = function (state, armyOrId, castleOrId, threshold) {
    var army = typeof armyOrId === "string" ? S.Systems.Army.get(state, armyOrId) : armyOrId;
    var castle = typeof castleOrId === "string" ? state.castles[castleOrId] : castleOrId;
    if (!army || !castle) return null;
    var c = cfg(), troops = S.Systems.Army.totalTroops(state, army), morale = avgArmyMorale(state, army);
    var profile = S.Data.getCastleProfile ? S.Data.getCastleProfile(castle) : { modifiers: { siegeDefense: 0 } };
    var assignment = S.Systems.Domestic && S.Systems.Domestic.assignmentEffects ? S.Systems.Domestic.assignmentEffects(state, castle) : { defenseBonus: 0 };
    var strategicDefenseBonus = Math.max(0, Number(profile.modifiers && profile.modifiers.siegeDefense) || 0) + Math.max(0, Number(assignment.defenseBonus) || 0);

  };

  function decodeEmbeddedTactical() {
    try {
      var binary = atob(EMBEDDED_TACTICAL_B64), bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    } catch (error) { return null; }
  }

  A.openPending = function () {
    var state = S.State.current, pending = state && state.events && state.events.pendingTacticalBattle;
    var overlay = document.getElementById("tacticalOverlay"), frame = document.getElementById("tacticalFrame");
    if (!pending || !overlay || !frame) return false;
    var embedded = decodeEmbeddedTactical();
    if (!embedded || embedded.indexOf("<!--__SENGOKU_TACTICAL_BOOTSTRAP__-->") < 0) {
      if (S.UI && S.UI.notify) S.UI.notify("内蔵会戦データを読み込めません。セーブ後に最新版を開き直してください。", "error");
      return false;
    }
    var safeSpec = JSON.stringify(pending.battleSpec || null).replace(/</g, "\\u003c");
    var bootstrap = "<scr" + "ipt>window.__SENGOKU_TACTICAL_INTEGRATED__=true;window.__SENGOKU_TACTICAL_SPEC__=" + safeSpec + ";</scr" + "ipt>";
    if (frame.removeAttribute) {
      frame.removeAttribute("src");
      frame.removeAttribute("srcdoc");
    }
    frame.srcdoc = embedded.replace("<!--__SENGOKU_TACTICAL_BOOTSTRAP__-->", bootstrap);
    overlay.classList.remove("hidden");
    overlay.setAttribute("aria-hidden", "false");
    document.body.classList.add("tactical-open");
    A.runtime.frame = frame;
    return true;
  };

  A.close = function () {
    var overlay = document.getElementById("tacticalOverlay"), frame = document.getElementById("tacticalFrame");
    if (overlay) { overlay.classList.add("hidden"); overlay.setAttribute("aria-hidden", "true"); }
    if (frame) {
      if (frame.removeAttribute) frame.removeAttribute("srcdoc");
      else frame.srcdoc = "";
      frame.src = "about:blank";
    }
    document.body.classList.remove("tactical-open");
    A.runtime.frame = null;
  };

  A.receiveMessage = function (event) {
    var frame = document.getElementById("tacticalFrame"), data = event && event.data;
    if (!frame || event.source !== frame.contentWindow || !data || data.type !== "PROJECT_SENGOKU_TACTICAL_OUTCOME") return false;
    if (window.location && window.location.origin && window.location.origin !== "null" && event.origin !== window.location.origin) return false;
    var state = S.State.current, pending = state && state.events && state.events.pendingTacticalBattle;

    if (!applied.ok) { if (S.UI && S.UI.notify) S.UI.notify(applied.errors.join(" / "), "error"); return true; }
    if (pending.kind === "field_battle") state.events.pendingTacticalBattle = null;
    var resumed = S.Systems.Turn.resumeAfterTactical ? S.Systems.Turn.resumeAfterTactical(state, { armyResumeState: resumeArmyState }) : { ok: true, stateChanges: {}, errors: [] };

    if (S.UI && S.UI.showBattleReport && applied.stateChanges && applied.stateChanges.report) S.UI.showBattleReport(applied.stateChanges.report);

  };

(function (S) {

      button.innerHTML = "<em class=\"castle-profile-mini\" aria-hidden=\"true\">" + S.UI.escape(profile.icon) + "</em><strong>" + S.UI.escape(castle.name) + "</strong><small>" + S.UI.escape(profile.title) + "・" + (known ? "兵" + castle.troops : "兵力不詳") + "</small>";
      layer.appendChild(button);
    });

    if (armyLayer && S.Systems.Army) {
      S.Systems.Army.all(state).forEach(function (army) {

        var x = fixedAtTarget ? to.x : from.x + (to.x - from.x) * progress, y = fixedAtTarget ? to.y : from.y + (to.y - from.y) * progress;

        marker.type = "button";
        marker.className = "army-marker" + (army.factionId === state.campaign.playerFactionId ? " player" : " enemy") + (army.mission === "intercept" ? " intercept" : "") + ((army.status === "marching" && army.factionId !== state.campaign.playerFactionId && army.destinationCastleId && state.castles[army.destinationCastleId] && state.castles[army.destinationCastleId].factionId === state.campaign.playerFactionId) ? " threat" : "") + (army.status === "in_battle" ? " in-battle" : "") + (army.status === "besieging" ? " besieging" : "") + (army.status === "returning" ? " returning" : "");

        var missionLabel = army.status === "returning" ? "敗走軍" : army.mission === "reinforce" ? "援軍" : army.mission === "intercept" ? "迎撃軍" : "軍";

    var assignment = S.Systems.Officer.assignment(officer), assignmentLabel = S.Systems.Officer.assignmentLabel(officer), castleName = assignment.castleId && state.castles[assignment.castleId] ? state.castles[assignment.castleId].name : null;

  <script data-source="src/ui/renderArmy.js">
(function (S) {
  "use strict";
  var U = S.UI;

  function unitTypeOptions(selected) {
    return Object.keys(S.Data.unitTypes).map(function (id) {
      var type = S.Data.unitTypes[id];
      return "<option value=\"" + U.escape(id) + "\"" + (id === selected ? " selected" : "") + ">" + U.escape(type.name) + "</option>";
    }).join("");
  }
  function officerOptions(officers, selected, allowBlank) {
    return (allowBlank ? "<option value=\"\">使用しない</option>" : "") + officers.map(function (officer) {
      var role = S.Systems.Officer.assignmentLabel ? S.Systems.Officer.assignmentLabel(officer) : "待機";
      return "<option value=\"" + U.escape(officer.id) + "\"" + (officer.id === selected ? " selected" : "") + ">" + U.escape(officer.name) + "［" + U.escape(role) + "］（統" + officer.stats.leadership + " 武" + officer.stats.might + "）</option>";
    }).join("");
  }

  U.showArmyPlanner = function (sourceId) {
    var state = S.State.current, source = state.castles[sourceId];
    if (!source || source.factionId !== state.campaign.playerFactionId) { U.notify("自勢力の城を選んでください", "error"); return; }
    if (state.campaign.commands <= 0) { U.notify("命令回数がありません", "error"); return; }
    var targetRoutes = S.Systems.Army.reachableEnemyTargets(state, sourceId, state.campaign.playerFactionId, { maxHops: 3 });
    var officers = S.Systems.Officer.atCastle(state, sourceId, state.campaign.playerFactionId).filter(function (officer) {
      return officer.injury !== "重傷" && (!officer.assignment || officer.assignment.type !== "army") && !(S.Systems.Orders && S.Systems.Orders.isOfficerBusy(state, officer.id));
    });
    var available = S.Systems.Orders ? S.Systems.Orders.availableTroopsForCastle(state, sourceId) : Math.max(0, source.guardTroops - S.Config.MIN_GARRISON);
    if (!targetRoutes.length) { U.notify("自領を経由して到達できる侵攻先がありません", "error"); return; }
    if (!officers.length) { U.notify("出陣できる武将がいません", "error"); return; }
    if (available < S.Config.MIN_ATTACK_FORCE) { U.notify("最低守備兵を残すため出陣兵力が不足しています", "error"); return; }

    var firstTroops = Math.max(S.Config.MIN_ATTACK_FORCE, Math.min(available, Math.floor(available * 0.7)));

(function (S) {
  "use strict";
  var U = S.UI;

    if (maxCommit < S.Config.MIN_ATTACK_FORCE) { U.notify("最低守備兵" + S.Config.MIN_GARRISON + "を残すため、侵攻兵力が不足しています", "error"); return; }

      "<label class=\"field\"><span>侵攻先</span><select id=\"battleTarget\">" + targets.map(function (castle) { return "<option value=\"" + U.escape(castle.id) + "\"" + (castle.id === selectedTarget ? " selected" : "") + ">" + U.escape(castle.name) + "（兵" + (state.events.intel[castle.id] > 0 || opening ? castle.troops : "?") + "・防備" + castle.defense + "）</option>"; }).join("") + "</select></label>" +

      "<label class=\"field\"><span>副将</span><select id=\"battleDeputy\"><option value=\"\">なし</option>" + officers.map(function (officer) { return "<option value=\"" + U.escape(officer.id) + "\">" + U.escape(officer.name) + "</option>"; }).join("") + "</select></label>" +
      "<label class=\"field\"><span>投入兵力（" + S.Config.MIN_ATTACK_FORCE + "〜" + maxCommit + "、守備兵" + S.Config.MIN_GARRISON + "を残す）</span><input id=\"battleCommitted\" type=\"number\" min=\"" + S.Config.MIN_ATTACK_FORCE + "\" max=\"" + maxCommit + "\" value=\"" + Math.max(S.Config.MIN_ATTACK_FORCE, Math.min(maxCommit, Math.floor(source.troops * S.Config.DEFAULT_COMMIT_RATIO))) + "\"></label>" +

  };
  U.resolveBattleFromModal = function (button) {
    var state = S.State.current, commanderId = U.el("battleCommander").value, deputyId = U.el("battleDeputy").value;

      sourceId: button.dataset.battleSource,
      targetId: U.el("battleTarget").value,
      commanderId: commanderId,
      deputyId: deputyId || null,

  <script data-source="src/ui/renderEvents.js">
(function (S) {
  "use strict";
  var U = S.UI;
  function targetName(state, target) { var item = target && (target.type === "officer" ? state.officers[target.id] : target.type === "castle" ? state.castles[target.id] : state.factions[target.id]); return item ? item.name : ""; }
  U.showActiveEvent = function () {
    var state = S.State.current; S.Systems.Event.reconcileInstances(state);
    var instance = S.Systems.Event.getActiveEvent(state);
    if (!instance && S.Systems.Event.ensureOpeningCouncil) {
      var repaired = S.Systems.Event.ensureOpeningCouncil(state);
      if (!repaired.ok) { U.notify((repaired.errors || ["初陣軍議を復旧できませんでした"]).join(" / "), "error"); return false; }
      instance = S.Systems.Event.getActiveEvent(state);
      if (!instance && S.Systems.Event.getPendingInteraction(state)) return Boolean(U.openEventInteraction && U.openEventInteraction());
    }
    if (!instance) return false;
    var model = S.Systems.Event.renderEvent(state, instance); if (!model) return false;
    var targetInfo = Object.keys(model.targets).map(function (name) { var label = targetName(state, model.targets[name]); return label ? U.escape(label) : ""; }).filter(Boolean).join(" / ");
    var choices = model.choices.map(function (choice) {
      var speaker = choice.speakerTarget && model.targets[choice.speakerTarget] ? targetName(state, model.targets[choice.speakerTarget]) : "";
      return "<button class=\"choice event-choice\" data-event-choice=\"" + U.escape(choice.id) + "\" data-instance-id=\"" + U.escape(model.instanceId) + "\"" + (choice.enabled ? "" : " disabled aria-disabled=\"true\"") + "><strong>" + choice.label + "</strong>" + (speaker ? "<small>提案者: " + U.escape(speaker) + "</small>" : "") + (choice.costs ? "<small>費用: " + U.escape(choice.costs) + "</small>" : "") + (!choice.enabled ? "<small class=\"bad\">" + choice.disabledReason + "</small>" : "") + "</button>";
    }).join("");
    U.openModal("<div class=\"event-view\" data-event-modal><p class=\"kicker\">" + model.kicker + "</p><h2>" + model.title + "</h2><p>" + model.body + "</p>" + (targetInfo ? "<p class=\"muted\">対象: " + targetInfo + "</p>" : "") + "<div class=\"choices event-choices\">" + choices + "</div></div>", { event: true });
    return true;
  };
  U.showEventResult = function (historyEntry) {
    U.openModal("<div class=\"event-view\" data-event-modal><p class=\"kicker\">EVENT RESULT</p><h2>" + U.escape(historyEntry.title) + "</h2><p>" + U.escape(historyEntry.result) + "</p><div class=\"modal-actions\"><button class=\"button primary\" data-event-next>次へ</button></div></div>", { event: true });
  };
  U.eventChoiceLocks = {};
  U.resolveEventChoice = function (instanceId, choiceId) {
    if (U.eventChoiceLockState !== S.State.current) { U.eventChoiceLocks = {}; U.eventChoiceLockState = S.State.current; }
    var lockKey = instanceId + ":" + choiceId;
    if (U.eventChoiceLocks[lockKey]) return { ok: false, errors: ["このイベント選択は処理中です"] };
    U.eventChoiceLocks[lockKey] = true;
    var result = S.Systems.Event.resolveChoice(S.State.current, instanceId, choiceId);
    if (!result.ok) { delete U.eventChoiceLocks[lockKey]; return result; }
    if (U.commit(result, { render: false })) U.showEventResult(result.stateChanges.historyEntry);

  };
  U.activateEventChoice = function (key, instanceId, choiceId) {

  };

    U.openModal("<p class=\"kicker\">STORY ARC STATUS</p><h2>進行状況</h2>" + (ids.length ? ids.map(function (id) { var arc = arcs[id], definition = S.Data.StoryArcRegistry.definitions[id] || {}; return "<div class=\"record arc-status\"><strong>" + U.escape(definition.name || id) + "</strong><p>" + U.escape(arc.status) + " / " + U.escape(arc.currentStep || "-") + "</p></div>"; }).join("") : "<p>進行中のStory Arcはありません。</p>") + "<div class=\"modal-actions\"><button class=\"button primary\" data-close-modal>閉じる</button></div>");
  };
  U.eventDebugSnapshot = function () {
    var engine = S.State.current.events.engine;
    return { activeEvent: engine.activeEvent, queue: engine.queue, flags: S.State.current.events.flags, variables: engine.variables, counters: engine.counters, cooldowns: engine.cooldowns, arcs: engine.arcs, history: engine.history, diagnostics: engine.diagnostics };
  };
  U.openEventInteraction = function () {
    var interaction = S.Systems.Event.getPendingInteraction(S.State.current); if (!interaction) return false;
    U.showBattlePlanner(interaction.sourceId, interaction.opening, false, Object.assign({ targetId: interaction.targetId }, interaction.preset)); return true;
  };

  <script data-source="src/ui/debugPanel.js">
(function (S) {
  "use strict";
  var U = S.UI, D = S.Debug.Actions = {};
  D.setResources = function (state, gold, food, troops) {
    if (Number.isFinite(gold)) state.campaign.gold = Math.max(0, gold);
    if (Number.isFinite(food)) state.campaign.food = Math.max(0, food);
    if (Number.isFinite(troops)) { var castle = state.castles[state.campaign.selectedCastleId]; if (castle) S.Systems.Unit.setGuardTroops(state, castle, Math.max(0, troops)); }
    return { ok: true, stateChanges: {}, messages: ["資源を変更しました。"], errors: [] };
  };
  D.forceVictory = function (state) {
    Object.keys(state.castles).forEach(function (id) { state.castles[id].factionId = state.campaign.playerFactionId; state.castles[id].governorId = null; });
    S.State.repairState(state); return S.Systems.Victory.check(state);
  };
  D.reset = function () {
    var old = S.State.current, options = { scenarioId: old.campaign.scenarioId, playerFactionId: old.campaign.playerFactionId, difficultyId: old.campaign.difficultyId };
    S.State.current = S.State.createInitialState(options); S.Systems.Campaign.begin(S.State.current);
    return { ok: true, stateChanges: {}, messages: ["同じ設定の初期状態へ戻しました。"], errors: [] };
  };
  D.transferCastle = function (state, castleId, factionId) { return S.Systems.Campaign.transferCastle(state, castleId, factionId); };
  D.moveOfficer = function (state, officerId, castleId) { return S.Systems.Officer.moveOfficer(state, officerId, castleId, { consumeCommand: false, silent: false }); };
  D.runAI = function (state, seasons, random) {
    var completed = 0, actions = 0, rng = random || Math.random;
    for (var i = 0; i < seasons && !state.campaign.gameOver; i += 1) { var result = S.Systems.Turn.advance(state, { random: rng }); if (!result.ok) return result; completed += 1; actions += result.stateChanges.aiActions.length + result.stateChanges.aiDiplomacyActions.length; }
    return { ok: true, stateChanges: { completed: completed, actions: actions }, messages: ["AIを" + completed + "季実行（" + actions + "行動）しました。"], errors: [] };
  };
  D.simulate100 = function (state) { return S.Systems.AI.simulate(state, 100, Math.random); };
  D.simulateAll = function (state) { return S.Systems.AI.simulateAllFactions(state, 200, Math.random, { terminationLimit: 300 }); };
  D.repair = function (state) { var result = S.State.repairState(state); return { ok: true, stateChanges: { changes: result.changes }, messages: ["整合性修復: " + result.changes.length + "件"], errors: [] }; };

  <script data-source="src/main.js">
(function (S) {
  "use strict";
  var U = S.UI;
  function normalizeSystemTestMode(state) {

  }

    var begun = S.Systems.Campaign.begin(S.State.current); normalizeSystemTestMode(S.State.current); if (!begun.ok) { U.notify(begun.errors.join(" / "), "error"); return; }

  }

    var state = S.State.current, castleId = state.campaign.selectedCastleId, result;
    if (action === "scout") { U.showScoutTargets(castleId, officerId); return; }

      if (result.ok && U.markGuideMilestone) U.markGuideMilestone("commandUsed");

  var clockRunner = { running: false, speed: 1, daysRun: 0, maxDays: 30, untilEvent: false, timer: null, lastResult: null };

  S.StrategicClock.isRunning = function () { return clockRunner.running; };

  }
  function ensureClockHud() {

      hud.innerHTML = '<span class="time-runner-pulse" aria-hidden="true"></span><div><small>STRATEGIC CLOCK</small><strong id="timeRunnerDate"></strong></div><span id="timeRunnerSpeed" class="time-runner-speed"></span><button type="button" class="time-runner-stop" data-pause-clock>停止</button>';
      mapPanel.appendChild(hud);
    }
    return hud;
  }
  function updateClockHud() {
    var hud = ensureClockHud(), date = U.el("timeRunnerDate"), speed = U.el("timeRunnerSpeed");

    if (date && S.State.current) date.textContent = S.Systems.Turn.shortDateLabel ? S.Systems.Turn.shortDateLabel(S.State.current) : S.Systems.Turn.dateLabel(S.State.current);
    if (speed) speed.textContent = "×" + clockRunner.speed + "・" + clockRunner.daysRun + "日経過";
    if (document.body && document.body.classList) document.body.classList.toggle("time-running", clockRunner.running);
  }
  function clockDelay(speed) { if (speed >= 10) return 90; if (speed >= 3) return 260; return 650; }

    if (armyBattle && U.showBattleReport) { U.showBattleReport(armyBattle); return true; }
    var completed = result.stateChanges.completedTasks || [], started = result.stateChanges.startedOrders || {}, immediateFailures = (started.immediateResults || []).filter(function (item) { return !item.ok; });
    if (immediateFailures.length) U.notify(immediateFailures[0].text, "error");
    else if (completed.length) { var failedTask = completed.find(function (item) { return !item.ok; }); U.notify(failedTask ? failedTask.text : completed.length + "件の任務が完了しました。" + S.Systems.Turn.dateLabel(S.State.current), failedTask ? "error" : ""); }
    var pending = S.State.current.diplomacy.proposals.some(function (item) { return item.status === "pending" && item.targetFactionId === S.State.current.campaign.playerFactionId; });
    if (pending) { U.showPendingProposals(); return true; }
    if (U.showPrisonerNotifications && U.showPrisonerNotifications()) return true;

  }
  function stopClockRunner(reason, result) {
    if (clockRunner.timer) { clearTimeout(clockRunner.timer); clockRunner.timer = null; }

    clockRunner.lastResult = result || clockRunner.lastResult;
    updateClockHud();
    if (wasRunning && S.State.current && S.State.current.settings.autosave) {
      var saved = S.Save.autosave(S.State.current);

    }
    if (!result) { if (reason === "manual") U.notify("時間を停止しました。" + S.Systems.Turn.dateLabel(S.State.current)); return; }
    if (reason === "limit" && result.stateChanges && result.stateChanges.stopReason === "limit") U.notify(clockRunner.daysRun + "日進みました。" + S.Systems.Turn.dateLabel(S.State.current));

  }
  S.StrategicClock.stop = function () { stopClockRunner("manual"); };
  function clockStep() {
