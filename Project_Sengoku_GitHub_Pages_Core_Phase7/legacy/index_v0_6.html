function renderCouncil(){if(st.mode==="opening"){els.councilTitle.textContent="最初の一手";els.phaseBadge.textContent="初陣前";const data=[{o:"keiketsu",title:"徴兵してから攻める",text:"兵を20増やして損害を抑える。",good:"堅実・損害減",bad:"金20消費",t:"standard"},{o:"soma",title:"夜襲を仕掛ける",text:"知略で守備の隙を突く。",good:"成功時の損害小",bad:"失敗時は混乱",t:"night"},{o:"kanenobu",title:"今すぐ強襲する",text:"兼信の武力で最短決着を狙う。",good:"勲功・経験大",bad:"負傷危険大",t:"assault"}];els.proposals.innerHTML=data.map(x=>{const o=officer(x.o);return`<article class="proposal"><p class="k">${o.name}の提案</p><h4>${x.title}</h4><p>${x.text}</p><span class="good">利点：${x.good}</span><span class="bad">危険：${x.bad}</span><button data-opening="${x.o}|${x.t}">この策で初陣</button></article>`}).join("");document.querySelectorAll("[data-opening]").forEach(b=>b.onclick=()=>{const [oid,t]=b.dataset.opening.split("|");if(oid==="keiketsu"&&!st.openingRecruit){if(st.gold<20)return toast("金が不足しています");st.gold-=20;castle("kiyosu").troops+=20;st.openingRecruit=true;addChron("蒼月景継の進言により徴兵を行い、初陣に備えた。")}openBattle("kiyosu","narumi",oid,t,true)})}else{els.councilTitle.textContent="今季の家臣提案";els.phaseBadge.textContent=`${SEASONS[st.season]}・命令${st.commands}`;const proposals=campaignProposals();els.proposals.innerHTML=proposals.map(p=>`<article class="proposal"><p class="k">${officer(p.officerId).name}の提案</p><h4>${p.title}</h4><p>${p.text}</p><div class="officerline"><i>将</i><span>${p.reason}</span></div><button data-proposal="${p.action}|${p.officerId}|${p.castleId||""}">提案を採用</button></article>`).join("");document.querySelectorAll("[data-proposal]").forEach(b=>b.onclick=()=>{const [action,oid,cid]=b.dataset.proposal.split("|");if(cid)st.selectedCastleId=cid;command(action,oid)})}}
function campaignProposals(){const holdings=owned();if(!holdings.length)return[];const frontline=holdings.find(c=>c.neighbors.some(n=>castle(n).owner!==0))||holdings[0];const weak=holdings.slice().sort((a,b)=>a.troops-b.troops)[0];const enemy=frontline.neighbors.map(castle).find(c=>c.owner!==0);const arr=[{officerId:"keiketsu",title:`${weak.name}の守りを整える`,text:"兵を集め、次の敵襲に備えるべきです。",reason:"慎重な景継は損害を嫌います。",action:"recruit",castleId:weak.id},{officerId:"soma",title:enemy?`${enemy.name}を偵察する`:"領内を整える",text:enemy?"正確な兵力を把握すれば、無謀な戦を避けられます。":"占領地の収入を増やします。",reason:"宗真の知略・政治を活かせます。",action:enemy?"scout":"develop",castleId:frontline.id},{officerId:"kanenobu",title:enemy?`${enemy.name}へ攻め込む`:"兵を鍛える",text:enemy?"敵に立て直す時間を与えるな。":"次の戦で先陣を任せろ。",reason:"兼信は攻勢を望んでいます。",action:enemy?"attack":"train",castleId:frontline.id}];return arr}
function chooseOfficer(castleId,title,callback,filter=()=>true){const list=officersAt(castleId,0).filter(filter);if(!list.length)return toast("この城に命令できる武将がいません");openModal(`<p class="k">ASSIGN RETAINER</p><h2>${title}</h2><div class="choices">${list.map(o=>`<button class="choice" data-off="${o.id}"><strong>${o.name}</strong><small>${o.traits.join("・")} / 統${o.stats.leadership} 武${o.stats.might} 知${o.stats.intellect} 政${o.stats.politics} / 疲労${o.fatigue}${o.injury?` / ${o.injury}`:""}</small></button>`).join("")}</div>`);document.querySelectorAll("[data-off]").forEach(b=>b.onclick=()=>{const o=officer(b.dataset.off);closeModal();callback(o)})}
function command(type,forcedOfficerId=null){if(st.gameOver)return;if(st.commands<=0)return toast("今季の命令を使い切りました");const c=castle(st.selectedCastleId);if(!c||c.owner!==0)return toast("自勢力の城を選択してください");if(type==="attack")return chooseAttackTarget(c,forcedOfficerId);const run=o=>{let merit=0,history="";if(type==="develop"){if(st.gold<15)return toast("金が不足しています");st.gold-=15;const gain=2+Math.floor(o.stats.politics/35);c.income+=gain;o.exp+=12;o.fatigue+=8;merit=8;history=`${c.name}の内政を整え、収入を${gain}増やした。`;addLog(`${o.name}が${c.name}で内政。収入が${gain}増加。`,"good");addChron(`${o.name}は${c.name}の内政を整えた。`)}else if(type==="recruit"){if(st.gold<20||st.food<10)return toast("金または兵糧が不足しています");st.gold-=20;st.food-=10;const gain=18+Math.floor(o.stats.leadership/12);c.troops+=gain;o.exp+=10;o.fatigue+=10;merit=7;history=`${c.name}で${gain}の兵を集めた。`;addLog(`${o.name}が${c.name}で${gain}の兵を集めた。`,"good")}else if(type==="train"){if(st.food<5)return toast("兵糧が不足しています");st.food-=5;const gain=12+Math.floor(o.stats.leadership/25);c.morale=Math.min(100,c.morale+gain);o.exp+=10;o.fatigue+=12;merit=7;history=`${c.name}の兵を鍛え、士気を${gain}高めた。`;addLog(`${o.name}の訓練で${c.name}の士気が${gain}上昇。`,"good")}else if(type==="rest"){o.fatigue=Math.max(0,o.fatigue-35);o.health=Math.min(100,o.health+20);if(o.injury==="重傷"&&o.health>=70){o.injury="軽傷";remember(o,"重傷から回復し、軽傷の状態まで戻った。",true)}else if(o.injury==="軽傷"&&o.health>=85){o.injury=null;remember(o,"傷が癒え、再び万全の状態となった。",true)}merit=2;history="今季は休養し、次の働きに備えた。";addLog(`${o.name}は休養し、体調を整えた。`,"good")}else if(type==="scout"){if(st.gold<10)return toast("金が不足しています");const targets=c.neighbors.map(castle).filter(x=>x.owner!==0);if(!targets.length)return toast("隣接する敵城がありません");st.gold-=10;targets.forEach(t=>st.intel[t.id]=3);o.exp+=12;o.fatigue+=7;merit=10;history="敵領への偵察を成功させ、兵力と防備を明らかにした。";updateGoal(o,"scout");addLog(`${o.name}の偵察で周辺の敵情が明らかになった。`,"good");addChron(`${o.name}は敵領への偵察を成功させた。`)}gainMerit(o,merit,history);if((o.id==="keiketsu"&&["recruit","train","rest"].includes(type))||(o.id==="soma"&&["develop","scout"].includes(type)))o.loyalty=Math.min(100,o.loyalty+1);st.commands--;checkLevel(o);save();render()};if(forcedOfficerId){const o=officer(forcedOfficerId);if(!o||o.castleId!==c.id)return chooseOfficer(c.id,"担当武将を選択",run);run(o)}else chooseOfficer(c.id,"担当武将を選択",run)}
function chooseAttackTarget(source,forcedOfficerId){const targets=source.neighbors.map(castle).filter(c=>c.owner!==0);if(!targets.length)return toast("隣接する敵城がありません");openModal(`<p class="k">SELECT TARGET</p><h2>${source.name}から侵攻</h2><div class="choices">${targets.map(t=>`<button class="choice" data-target="${t.id}"><strong>${t.name}</strong><small>${st.intel[t.id]>0?`兵${t.troops}・防備Lv.${t.defense}`:"兵力不詳・偵察推奨"}</small></button>`).join("")}</div>`);document.querySelectorAll("[data-target]").forEach(b=>b.onclick=()=>{const target=b.dataset.target;closeModal();if(forcedOfficerId&&officer(forcedOfficerId)?.castleId===source.id)openBattle(source.id,target,forcedOfficerId,null,false);else chooseOfficer(source.id,"総大将を選択",o=>openBattle(source.id,target,o.id,null,false),o=>o.health>30)})}
function openBattle(sourceId,targetId,commanderId,tacticDefault=null,opening=false){

    <div id="rivalPreview" class="rival-preview"></div><div id="battleVoices" class="battle-council"></div><div id="battleForecast" class="forecast"></div>
    <div class="modalactions"><button id="battleStart" class="btn primary">出陣する</button></div>`);
  if(tacticDefault)$("battleTactic").value=tacticDefault;
  const fillDeputies=()=>{const cid=$("battleCommander").value;const previous=$("battleDeputy")?.value;$("battleDeputy").innerHTML=`<option value="">副将なし</option>`+available.filter(o=>o.id!==cid).map(o=>`<option value="${o.id}">${o.name} — ${o.role}</option>`).join("");if(previous&&previous!==cid&&available.some(o=>o.id===previous))$("battleDeputy").value=previous;else{const preferred=available.find(o=>o.id!==cid);if(preferred)$("battleDeputy").value=preferred.id}};
  const update=()=>{fillDeputies();const o=officer($("battleCommander").value),d=officer($("battleDeputy").value),t=$("battleTactic").value,r=$("battleRetreat").value,f=forecast(source,target,o,t,r,d),foe=battleOpponent(target,o),rv=foe?rivalry(o.id,foe.id):null;$("battleForecast").innerHTML=`戦況予測<b>${f.label}</b>攻撃予測 ${Math.round(f.attack)} / 防御予測 ${Math.round(f.defense)}<br>総大将負傷危険度 約${f.risk}%${d?`<br>副将補正：${d.name}の${d.traits[0]}が部隊を支えます。`:""}`;$("rivalPreview").innerHTML=foe?`<div class="rival-head"><div><p class="k">OPPOSING OFFICER</p><h4>${foe.name} <span class="rival-state ${rivalryClass(rv)}">${rivalryLabel(rv)}</span></h4></div><span>統${foe.stats.leadership} 武${foe.stats.might}</span></div><p>${rivalBattleQuote(foe,o,rv)}${rv?`<br>対決 ${rv.encounters}回 / 敬意${rv.respect} / 怨恨${rv.resentment}${rv.vengeance>0?` / <span class="vengeance">復讐心</span>`:""}`:"<br>この戦いが二人の最初の記憶になります。"}</p>`:"<p>敵将の姿は確認できません。</p>";const advice=battleAdvice(o,d,t,target);$("battleVoices").innerHTML=advice.map(x=>`<div class="battle-voice"><span>${x.name}</span><p>「${x.text}」</p></div>`).join("")};
  $("battleCommander").onchange=update;$("battleDeputy").onchange=update;$("battleTactic").onchange=update;$("battleRetreat").onchange=update;update();
  $("battleStart").onclick=()=>runBattle(sourceId,targetId,$("battleCommander").value,$("battleDeputy").value||null,$("battleTactic").value,$("battleRetreat").value,opening)
}function battleAdvice(cmd,deputy,tactic,target){const main=cmd.id==="keiketsu"?"兵を生かして帰すことまでが勝利です。":cmd.id==="soma"?"敵の目が正面を向くなら、勝機はその背後にあります。":"俺を先頭に置け。道は斬り開く。";let sub="副将を置かず、総大将の判断に集中します。";if(deputy)sub=deputy.id==="keiketsu"?"崩れた戦線は私が支えます。無理だけはなさらぬよう。":deputy.id==="soma"?"大将が前を見るなら、私は敵の次の手を読みましょう。":deputy.id==="kanenobu"?"副将だろうと先陣は譲らん。":"総大将を支え、勝機を逃しません。";const foe=battleOpponent(target,cmd),r=foe?rivalry(cmd.id,foe.id):null;return[{name:cmd.name,text:main},{name:deputy?.name||"軍議記録",text:sub},{name:foe?.name||"敵情",text:rivalBattleQuote(foe,cmd,r).replace(/^「|」$/g,"")} ]}function forecast(source,target,o,t,r,deputy=null){const committed=Math.floor(source.troops*.65);let attack=committed*(1+o.stats.leadership/230)*(source.morale/75)*(1-o.fatigue/180);let risk=15;if(t==="night"){attack*=1+o.stats.intellect/340;risk+=o.stats.intellect<70?12:-4}else if(t==="assault"){attack*=1+o.stats.might/310;risk+=20}else attack*=1.12;if(deputy){attack*=1+(deputy.stats.leadership+deputy.stats.intellect)/1500;if(deputy.traits.includes("慎重")||deputy.traits.includes("忠義"))risk-=4;if(deputy.traits.includes("勇敢"))attack*=1.035}if(r==="safe"){attack*=.88;risk-=9}else if(r==="last"){attack*=1.14;risk+=17}const gov=officer(target.governorId),foe=battleOpponent(target,o),rv=foe?rivalry(o.id,foe.id):null;let defense=target.troops*(1+(gov?.stats.leadership||60)/300)*(1+(target.defense-1)*.13)*(target.morale/75);if(rv?.vengeance>0||rv?.resentment>=30)defense*=1.1;else if(rv?.respect>=35)defense*=.98;const ratio=attack/defense;return{attack,defense,risk:Math.max(4,Math.round(risk+o.fatigue/8)),label:ratio>=1.25?"有利":ratio>=.9?"互角":"不利"}}function battleScenario(cmd,deputy,tactic,target){if(cmd.id==="kanenobu"||tactic==="assault")return{kind:"breakthrough",title:"先陣が敵陣深くへ突出",text:`${cmd.name}の部隊が敵の本陣へ迫る一方、側面から伏兵が現れました。`,choices:[{id:"reinforce",label:"副将に援軍を任せる",desc:"救出と攻勢を両立する。副将の力量が重要。",attackMod:.05,lossMod:.01,riskMod:-7,relation:8},{id:"withdraw",label:"直ちに撤退を命じる",desc:"損害を抑えるが、勇将の不満が残る   if(governed&&castleBetrayal){governed.owner=targetFaction;governed.troops=Math.max(12,Math.floor(governed.troops*.75));addChron(`${o.name}は${governed.name}の兵を率いて${ownerName(targetFaction)}へ離反した。`);o.castleId=governed.id}
  else{if(governed){const replacement=officersAt(governed.id,0).find(x=>x.id!==o.id)||st.officers.find(x=>x.faction===0&&x.status==="active"&&x.id!==o.id);governed.governorId=replacement?.id||null}const home=st.castles.find(c=>c.owner===targetFaction);o.castleId=home?.id||null;addChron(`${o.name}は蒼月家を去り、${ownerName(targetFaction)}へ仕えた。`)}
  o.faction=targetFaction;o.role="離反武将";o.loyalty=72;o.grievance=0;o.promise=null;o.warningTurn=null;o.lordTrust=20;st.houseHonor=clamp(st.houseHonor-5,0,100);st.officers.filter(x=>x.faction===0&&x.status==="active").forEach(x=>addRelation(x.id,o.id,-12,`${o.name}が主家を去った。`));remember(o,"蒼月家を離れ、敵家へ仕えた。",true);recordLoyaltyEvent(o,"離反",castleBetrayal&&governed?`${governed.name}ごと敵家へ寝返った。`:"城を離れ、敵家へ去った。");addLog(`${o.name}が${ownerName(targetFaction)}へ離反した。`,"bad");closeModal();checkGame();render();
}
function checkLoyaltyDrama(){
  if(st.gameOver||st.mode==="opening")return;const active=st.officers.filter(o=>o.faction===0&&o.status==="active");if(!active.length)return;
  const soma=officer("soma");if(!st.firstLoyaltyEventShown&&st.turnCount>=1&&soma?.faction===0&&soma.status==="active"){st.firstLoyaltyEventShown=true;save();return showEmissaryIncident(soma)}
  const crisis=active.filter(o=>loyaltyRisk(o)>=75&&o.warningTurn!=null&&o.warningTurn<st.turnCount).sort((a,b)=>loyaltyRisk(b)-loyaltyRisk(a))[0];if(crisis)return showDefectionCrisis(crisis);
  const warning=active.filter(o=>loyaltyRisk(o)>=52&&(o.warningTurn==null||st.turnCount-o.warningTurn>=2)).sort((a,b)=>loyaltyRisk(b)-loyaltyRisk(a))[0];if(warning)return showDefectionWarning(warning);
}

function showRivalTreatment(id){const o=officer(id),r=strongestRivalryForEnemy(id),p=r?officer(r.playerId):null;if(!o||!r||!p)return showPrisoners();openModal(`<p class="k">RIVAL'S FATE</p><h2>${o.name}の処遇</h2><div class="rival-card"><h4>${p.name}と${o.name} — <span class="rival-state ${rivalryClass(r)}">${rivalryLabel(r)}</span></h4><p>対決${r.encounters}回 / ${p.name}の勝利${r.playerWins} / ${o.name}の勝利${r.enemyWins}</p><div class="rival-meters"><div class="rival-meter"><span>敬意</span><strong>${r.respect}</strong></div><div class="rival-meter"><span>怨恨</span><strong>${r.resentment}</strong></div></div></div><p>捕虜をどう扱うかは、次の再戦、登用後の忠誠、家名の評判に残ります。</p><div class="rival-treatment"><div class="rival-option"><strong>武名を認め、無条件で解放</strong><small>家名信用と敬意が上がります。敵として戻る可能性がありますが、借りを記憶します。</small><button class="btn primary wide" data-rival-fate="honor">名誉ある解放</button></div><div class="rival-option"><strong>宿敵として臣従を迫る</strong><small>敬意が高いほど成功しやすい。成功すれば特性「旧敵の誓い」を得ます。</small><button class="btn secondary wide" data-rival-fate="oath">臣従を迫る</button></div><div class="rival-option"><strong>屈辱を与えて解放</strong><small>家名信用が下がり、相手は復讐心を得ます。次の対決では敵が強化されます。</small><button class="btn danger wide" data-rival-fate="humiliate">屈辱して解放</button></div></div><div class="modalactions"><button id="rivalNormalRecruit" class="btn secondary">通常の登用交渉</button><button id="rivalBack" class="btn secondary">戻る</button></div>`);document.querySelectorAll("[data-rival-fate]").forEach(b=>b.onclick=()=>resolveRivalTreatment(id,b.dataset.rivalFate));$("rivalNormalRecruit").onclick=()=>showRecruitNegotiation(id);$("rivalBack").onclick=showPrisoners}
function resolveRivalTreatment(id,mode){const o=officer(id),r=strongestRivalryForEnemy(id),p=r?officer(r.playerId):null;if(!o||!r||!p)return;if(mode==="honor"){returnRivalToFaction(o);r.respect=clamp(r.respect+17,0,100);r.resentment=clamp(r.resentment-8,0,100);r.treatment="honor_release";st.houseHonor=clamp(st.houseHonor+6,0,100);if(!o.traits.includes("恩義"))o.traits.push("恩義");addRivalMemory(r,`${p.name}は${o.name}の武名を認め、無条件で解放した。`,"treatment");addChron(`${p.name}は捕虜となった${o.name}の武名を認め、解放した。`);addLog(`${o.name}を名誉ある形で解放した。`,"major");closeModal();render()}else if(mode==="humiliate"){returnRivalToFaction(o);r.respect=clamp(r.respect-7,0,100);r.resentment=clamp(r.resentment+24,0,100);r.vengeance=2;r.treatment="humiliated";st.houseHonor=clamp(st.houseHonor-6,0,100);if(!o.traits.includes("復讐心"))o.traits.push("復讐心");addRivalMemory(r,`${o.name}は${p.name}から屈辱を受け、復讐を誓った。`,"treatment");addChron(`${o.name}は捕虜から解放されたが、${p.name}への復讐を誓った。`);addLog(`${o.name}は屈辱を忘れず、復讐心を燃やしている。`,"bad");closeModal();render()}else{const factionAlive=st.castles.some(c=>c.owner===o.faction);let chance=.28+r.respect/170-r.resentment/260+st.houseHonor/500+(factionAlive?0:.18);chance=clamp(chance,.12,.9);if(Math.random()<chance){st.prisoners=st.prisoners.filter(x=>x!==o.id);o.status="active";o.faction=0;o.castleId=owned()[0]?.id||"kiyosu";o.loyalty=68;o.grievance=0;o.lordTrust=70;o.ambitionKnown=true;normalizeOfficer(o);if(!o.traits.includes("旧敵の誓い"))o.traits.push("旧敵の誓い");o.goal={title:"宿敵から忠臣へ",text:`${p.name}と同じ戦場で勝利し、誓いを証明する。`,target:1,reward:"共闘",stat:"leadership",progress:0,completed:false,flags:{}};r.status="allied";r.respect=clamp(r.respect+12,0,100);r.treatment="oath";addRelation(p.id,o.id,18,`${o.name}は宿敵としての敬意から臣従を誓った。`);addRivalMemory(r,`${o.name}は${p.name}に臣従し、旧敵から家臣となった。`,"oath");remember(o,`${p.name}との因縁を越え、蒼月家へ臣従した。`,true);gainMerit(p,5,`${o.name}を宿敵から家臣へ迎えた。`);addChron(`${o.name}は宿敵${p.name}へ臣従を誓い、蒼月家の家臣となった。`);addLog(`${o.name}が宿敵から家臣となった。`,"major");closeModal();render()}else{r.resentment=clamp(r.resentment+5,0,100);r.respect=clamp(r.respect+2,0,100);addRivalMemory(r,`${o.name}は${p.name}への臣従を拒んだ。`,"refusal");addLog(`${o.name}は「敵として決着をつける」と臣従を拒んだ。`,"bad");save();showRivalTreatment(id)}}}
function showRivalArchive(){const list=rivalriesList().sort((a,b)=>rivalryScore(b)-rivalryScore(a));openModal(`<p class="k">RIVALRY CHRONICLE</p><h2>因縁録</h2><p>敵将との対決、敬意、怨恨、処遇を記録します。勝敗だけでなく「どのような敵だったか」が戦役の記憶になります。</p>${list.length?list.map(r=>{const p=officer(r.playerId),e=officer(r.enemyId);return`<div class="rival-card"><h4>${p.name} × ${e.name} <span class="rival-state ${rivalryClass(r)}">${rivalryLabel(r)}</span></h4><p>対決${r.encounters}回 / ${p.name} ${r.playerWins}勝 / ${e.name} ${r.enemyWins}勝 / 敬意${r.respect} / 怨恨${r.resentment}${r.vengeance>0?` / <span class="vengeance">復讐心${r.vengeance}</span>`:""}</p>${r.memories.slice(-4).reverse().map(m=>`<div class="rival-memory">${m.date} — ${m.text}</div>`).join("")}</div>`}).join(""):"<p>まだ因縁は生まれていません。最初の合戦後に記録されます。</p>"}<div class="modalactions"><button id="rivalArchiveClose" class="btn primary">閉じる</button></div>`);$("rivalArchiveClose").onclick=closeModal}

}function recruitPrisoner(id,method,recruiterId){
  const costs={sincere:15,promise:10,honor:5},cost=costs[method]||15;if(st.gold<cost)return toast("金が不足しています");
  const o=officer(id),recruiter=officer(recruiterId)||officer("soma");st.gold-=cost;
  let chance=.24+(recruiter.stats.politics+recruiter.stats.intellect)/420-o.loyalty/360+st.houseHonor/500;
  if(method==="promise")chance+=.28;if(method==="honor"&&recruiter.stats.might>=75)chance+=.16;if(method==="sincere")chance+=.12;chance=clamp(chance,.12,.9);
  if(Math.random()<chance){
    o.status="active";o.faction=0;o.castleId=owned()[0].id;o.loyalty=method==="promise"?64:54;o.grievance=0;o.lordTrust=method==="sincere"?65:55;o.ambitionKnown=true;normalizeOfficer(o);
    o.goal={title:"新たな主家での再起",text:"蒼月家の合戦で勝利し、自分の価値を証明する。",target:1,reward:"再起",stat:"leadership",progress:0,completed:false,flags:{}};
    if(method==="promise")o.promise={type:"castle",text:"二季以内に城主へ取り立てる",madeTurn:st.turnCount,dueTurn:st.turnCount+2,status:"pending"};
    st.prisoners=st.prisoners.filter(x=>x!==id);remember(o,`${recruiter.name}の説得を受け、捕虜から蒼月家へ仕えることになった。`,true);gainMerit(recruiter,4,`${o.name}の登用を成功させた。`);addLog(`${recruiter.name}の説得により、${o.name}の登用に成功した。`,"major");addChron(`捕虜となった${o.name}は、${recruiter.name}の説得を受けて蒼月家へ仕えた。`);recordLoyaltyEvent(o,"登用",`${recruiter.name}の説得に応じて臣従した。`);const rr=strongestRivalryForEnemy(o.id);if(rr){rr.status="allied";rr.respect=clamp(rr.respect+8,0,100);addRivalMemory(rr,`${o.name}は登用交渉に応じ、旧敵から家臣となった。`,"oath")}closeModal();render();
  }else{o.loyalty=Math.max(20,o.loyalty-4);addLog(`${o.name}は${recruiter.name}の登用を拒んだ。`,"bad");remember(recruiter,`${o.name}の登用交渉に失敗した。`);save();showPrisoners()}
}
function releasePrisoner(id){const o=officer(id);o.status="active";const home=st.castles.find(c=>c.owner===o.faction);if(home)o.castleId=home.id;st.prisoners=st.prisoners.filter(x=>x!==id);st.houseHonor=clamp(st.houseHonor+4,0,100);addLog(`${o.name}を解放した。家名の信用が上がった。`,"good");addChron(`${o.name}を捕虜から解放した。`);recordLoyaltyEvent(o,"解放","捕虜から解放され、蒼月家の寛大さを知った。");closeModal();render()}
function endTurn(){if(st.mode==="opening")return;if(st.gameOver)return;st.officers.filter(o=>o.faction===0&&o.status==="active").forEach(o=>updateGoal(o,"seasonEnd"));const hasMerit=st.officers.some(o=>o.faction===0&&o.status==="active"&&(o.seasonMerit||0)>0);if(hasMerit)return showSeasonReview();advanceTurn()}
function showSeasonReview(){const list=st.officers.filter(o=>o.faction===0&&o.status==="active").sort((a,b)=>(b.seasonMerit||0)-(a.seasonMerit||0));openModal(`<p class="k">SEASON REVIEW</p><h2>${SEASONS[st.season]}の功績評定</h2><p>誰の働きを最も評価するかで、忠誠と家臣同士の関係が変化します。</p><div class="review-list">${list.map(o=>`<div class="review-choice"><div><h4>${o.name}</h4><p>今季功績 <span class="review-merit">${o.seasonMerit||0}</span> / 累計${o.merit}</p></div><button class="btn primary" data-award="${o.id}" ${st.gold<10?"disabled":""}>褒賞する（金10）</button></div>`).join("")}<div class="review-choice"><div><h4>家臣団全体を労う</h4><p>全員の忠誠が少し上昇し、関係も穏やかになります。</p></div><button id="praiseAll" class="btn secondary">等しく労う</button></div><div class="review-choice"><div><h4>評定を省く</h4><p>費用はかかりませんが、最も働いた家臣が不満を抱く可能性があります。</p></div><button id="skipReview" class="btn secondary">評定を省く</button></div></div>`);document.querySelectorAll("[data-award]").forEach(b=>b.onclick=()=>resolveSeasonReview("award",b.dataset.award));$("praiseAll").onclick=()=>resolveSeasonReview("all");$("skipReview").onclick=()=>resolveSeasonReview("skip")}
function resolveSeasonReview(mode,id=null){
  const list=st.officers.filter(o=>o.faction===0&&o.status==="active").sort((a,b)=>(b.seasonMerit||0)-(a.seasonMerit||0)),top=list[0];
  if(mode==="award"){
    if(st.gold<10)return toast("金が不足しています");const chosen=officer(id);st.gold-=10;chosen.lastRewardTurn=st.turnCount;chosen.grievance=Math.max(0,chosen.grievance-9);chosen.neglect=-1;chosen.lordTrust=clamp(chosen.lordTrust+4,0,100);changeLoyalty(chosen,8,"季節の功績評定で第一の功臣として褒賞された。");gainMerit(chosen,3,"季節の功績評定で褒賞を受けた。");
    if(top&&top.id!==chosen.id&&(top.seasonMerit||0)>(chosen.seasonMerit||0)){top.grievance+=9;top.neglect+=1;changeLoyalty(top,-3,"自分より功績の少ない家臣が褒賞された。");addRelation(top.id,chosen.id,-4,`${chosen.name}が褒賞され、自分の働きが評価されなかった。`);addLog(`${top.name}は評定の結果に不満を抱いた。`,"bad")}else if(top)list.filter(o=>o.id!==chosen.id).forEach(o=>addRelation(o.id,chosen.id,1));
    addChron(`${chosen.name}は${SEASONS[st.season]}の功績評定で褒賞を受けた。`);addLog(`${chosen.name}を今季第一の功臣として褒賞した。`,"major");recordLoyaltyEvent(chosen,"評定","第一の功臣として評価された。");
  }else if(mode==="all"){
    list.forEach(o=>{changeLoyalty(o,2,"家臣団全体の働きを労われた。");o.grievance=Math.max(0,o.grievance-2);o.neglect=Math.max(-1,o.neglect-1)});for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)addRelation(list[i].id,list[j].id,1);addChron("家臣団全体の働きを等しく労った。");addLog("家臣団全体を労い、結束が少し強まった。","good");
  }else if(top){top.grievance+=10;top.neglect+=1;changeLoyalty(top,-2,"功績評定が省かれ、自分の働きが報われなかった。");remember(top,"功績評定が行われず、自分の働きが報われなかった。",true);addLog(`${top.name}は評定が省かれたことに不満を感じた。`,"bad")}
  list.forEach(o=>o.seasonMerit=0);st.reviewCount++;closeModal();advanceTurn();
}
function advanceTurn(){
  const income=owned().reduce((a,c)=>a+c.income,0),foodGain=Math.max(10,owned().length*7);st.gold+=income;st.food+=foodGain;st.turnCount++;
  st.officers.filter(o=>o.status==="active").forEach(o=>{normalizeOfficer(o);o.fatigue=Math.max(0,o.fatigue-12);if(o.fatigue<25)o.health=Math.min(100,o.health+5);if(o.injury==="軽傷"&&o.health>=90)o.injury=null;if(o.injury==="重傷"&&o.health>=75)o.injury="軽傷";if(o.faction===0&&o.lastRewardTurn<st.turnCount-1)o.neglect+=1});
  checkPromises();Object.keys(st.intel).forEach(k=>{st.intel[k]--;if(st.intel[k]<=0)delete st.intel[k]});enemyTurn(1);enemyTurn(2);st.season++;if(st.season>=4){st.season=0;st.year++;st.officers.forEach(o=>o.age++)}seasonEvent();st.commands=st.maxCommands;addLog(`${SEASONS[st.season]}の軍議が始まった。`,"major");checkGame();render();setTimeout(checkLoyaltyDrama,80);
}
function enemyTurn(faction){const own=st.castles.filter(c=>c.owner===faction);if(!own.length)return;own.forEach(c=>c.troops+=4+Math.floor(Math.random()*6));const attacks=[];own.forEach(s=>s.neighbors.map(castle).filter(t=>t.owner!==faction).forEach(t=>{const ratio=s.troops/(t.troops*(1+(t.defense-1)*.12));attacks.push({s,t,ratio})}));attacks.sort((a,b)=>b.ratio-a.ratio);const best=attacks[0];if(best&&best.ratio>1.35&&Math.random()<.65)resolveEnemyBattle(faction,best.s,best.t);else{const c=own.sort((a,b)=>a.troops-b.troops)[0];c.troops+=8;c.morale=Math.min(100,c.morale+5);addLog(`${ownerName(faction)}は${c.name}で兵を整えた。`)}}
function resolveEnemyBattle(faction,source,target){const committed=Math.floor(source.troops*.55);source.troops-=committed;const attack=committed*(.9+Math.random()*.25),defense=target.troops*(1+(target.defense-1)*.14);if(attack>defense){const old=target.owner;target.owner=faction;target.troops=Math.max(10,Math.floor(committed*.45));const gov=officer(target.governorId);if(gov&&gov.faction===old){const escape=target.neighbors.map(castle).find(c=>c.owner===old);if(escape){gov.castleId=escape.id;escape.governorId=gov.id}else{gov.status="prisoner";gov.castleId=null}}const attackGov=officer(source.governorId);if(attackGov){attackGov.castleId=target.id;target.governorId=attackGov.id;const replacement=officersAt(source.id,faction)[0];source.governorId=replacement?replacement.id:null}else target.governorId=null;addLog(`${ownerName(faction)}が${target.name}を攻略した。`,old===0?"bad":"");addChron(`${ownerName(faction)}が${target.name}を攻略した。`)}else{target.troops=Math.max(8,target.troops-Math.floor(committed*.3));addLog(`${ownerName(faction)}の${target.name}侵攻は失敗した。`)}}
function seasonEvent(){if(st.season===2){const gain=18+owned().length*5;st.food+=gain;addLog(`秋の収穫で兵糧${gain}を得た。`,"good");addChron("領内で秋の収穫が行われた。")}else if(st.season===3&&Math.random()<.45){const c=owned()[Math.floor(Math.random()*owned().length)];c.morale=Math.max(35,c.morale-8);addLog(`厳しい冬により${c.name}の士気が低下した。`,`bad`)}else if(st.season===1&&Math.random()<.4){st.gold+=15;addLog("商人が訪れ、軍資金15を献上した。","good")}}
function checkGame(){const n=owned().length;if(n===4&&!st.gameOver){st.gameOver=true;addChron("蒼月家は尾張四城を支配し、短期戦役を制した。");const roster=st.officers.filter(o=>o.faction===0&&o.status==="active").sort((a,b)=>b.merit-a.merit);const hero=roster[0];const favorite=officer(st.favoriteOfficerId);const topRival=rivalriesList().sort((a,b)=>rivalryScore(b)-rivalryScore(a))[0],rp=topRival?officer(topRival.playerId):null,re=topRival?officer(topRival.enemyId):null;const heroText=hero?.id==="keiketsu"?"損害を抑えながら家中を支えた、静かな守護者。":hero?.id==="soma"?"敵の弱みを読み、策で勝利を引き寄せた軍師。":hero?.id==="kanenobu"?"常に先陣を駆け、戦局を切り開いた猛将。":"新たな主家で道を切り開いた功臣。";openModal(`<p class="k">SHORT CAMPAIGN COMPLETE</p><h2>尾張戦役、勝利</h2><p>蒼月家は全4城を支配しました。この戦役で最も大きな功績を残したのは、<strong class="major">${hero?.name||"家臣団"}</strong>です。</p><p>${heroText}</p>${favorite?`<p>あなたが選んだお気に入り武将は、<strong class="major">${favorite.name}</strong>でした。</p>`:""}${topRival?`<div class="rival-card"><p class="k">RIVAL OF THE CAMPAIGN</p><h4>戦役の宿敵：${rp?.name} × ${re?.name}</h4><p>${rivalryLabel(topRival)} / 対決${topRival.encounters}回 / 敬意${topRival.respect} / 怨恨${topRival.resentment}</p></div>`:""}<div class="ending-roster">${roster.map(o=>`<div class="ending-officer"><div><strong>${st.favoriteOfficerId===o.id?"★ ":""}${o.name}</strong><small>${o.traits.join("・")} / 忠誠${o.loyalty} / ${loyaltyRiskLabel(o)} / 目標${o.goal.completed?"達成":"未達"}</small></div><b>勲功 ${o.merit}</b></div>`).join("")}</div><p>景継と兼信：${relationLabel(relation("keiketsu","kanenobu"))}　景継と宗真：${relationLabel(relation("keiketsu","soma"))}　宗真と兼信：${relationLabel(relation("soma","kanenobu"))}</p><div class="modalactions"><button id="victoryChron" class="btn secondary">戦国記</button><button id="victoryRivals" class="btn secondary">因縁録</button><button id="victoryHero" class="btn secondary">第一功臣を見る</button><button id="victoryReset" class="btn primary">もう一度遊ぶ</button></div>`);$("victoryChron").onclick=showChronicle;$("victoryRivals").onclick=showRivalArchive;$("victoryHero").onclick=()=>showOfficerDetail(hero.id);$("victoryReset").onclick=()=>{st=initial();save();closeModal();render()}}else if(n===0&&!st.gameOver){st.gameOver=true;openModal(`<p class="k">GAME OVER</p><h2>蒼月家、滅亡</h2><p>すべての城を失いました。</p><div class="modalactions"><button id="defeatReset" class="btn primary">最初から</button></div>`);$("defeatReset").onclick=()=>{st=initial();save();closeModal();render()}}}function showBattleArchive(){const reports=(st.battleReports||[]).slice().reverse();openModal(`<p class="k">BATTLE ARCHIVE</p><h2>合戦記録</h2><p>勝敗、大将、副将、戦場判断に加え、敵将との因縁を記録しています。</p>${reports.length?reports.map(r=>`<div class="battle-report"><h4>${r.date} — ${r.name}</h4><small>${r.result} / 大将 ${r.commander} / 副将 ${r.deputy} / 敵将 ${r.enemy||"不明"} / ${r.tactic}</small><p>決断：${r.decision}<br>損失：${r.loss}${r.injuries?.length?`<br>負傷：${r.injuries.join("、")}`:""}<br>${r.relation}<br><span class="rival-report">${r.rivalry||"因縁記録なし"}</span></p></div>`).join(""):"<p>まだ合戦記録はありません。</p>"}<div class="report-actions"><button id="archiveRivals" class="btn secondary">因縁録</button><button id="archiveExport" class="btn secondary">プレイレポート出力</button><button id="archiveClose" class="btn primary">閉じる</button></div>`);$("archiveRivals").onclick=showRivalArchive;$("archiveExport").onclick=downloadPlayReport;$("archiveClose").onclick=closeModal}function downloadPlayReport(){const lines=["Project Sengoku Rebuild Alpha v0.6 プレイレポート","",`進行：永禄${st.year}年 ${SEASONS[st.season]}`,`所持城：${owned().length}/4`,`総兵力：${totalArmy()}`,`家名信用：${st.houseHonor}`,`お気に入り：${officer(st.favoriteOfficerId)?.name||"未設定"}`,"","【家臣団と忠誠】",...st.officers.filter(o=>o.faction===0&&o.status==="active").map(o=>`${o.name} Lv.${o.level} 勲功${o.merit} 忠誠${o.loyalty} 離反危険${loyaltyRisk(o)}（${loyaltyRiskLabel(o)}） 不満${o.grievance} 野心${ambitionLabel(o)} 約束：${promiseLabel(o)}`),"","【宿敵と因縁】",...rivalriesList().map((r,i)=>{const p=officer(r.playerId),e=officer(r.enemyId);return`${i+1}. ${p?.name} × ${e?.name} — ${rivalryLabel(r)} / 対決${r.encounters} / ${p?.name}${r.playerWins}勝・${e?.name}${r.enemyWins}勝 / 敬意${r.respect} / 怨恨${r.resentment}${r.vengeance>0?` / 復讐心${r.vengeance}`:""}`}),"","【因縁事件】",...(st.rivalEvents||[]).map((e,i)=>`${i+1}. ${e.date} ${e.player} × ${e.enemy} — ${e.text}`),"","【忠誠事件】",...(st.loyaltyEvents||[]).map((e,i)=>`${i+1}. ${e.date} ${e.officer} — ${e.type}：${e.text}`),"","【合戦記録】",...(st.battleReports||[]).flatMap((r,i)=>[`${i+1}. ${r.date} ${r.name} — ${r.result}`,`   大将：${r.commander} / 副将：${r.deputy} / 敵将：${r.enemy||"不明"} / 戦術：${r.tactic} / 撤退：${r.retreat}`,`   決断：${r.decision} / 損失：${r.loss}${r.injuries?.length?` / 負傷：${r.injuries.join("、")}`:""}`,`   ${r.moment||"特性行動なし"}`,`   ${r.conversation}`,`   味方関係：${r.relation}`,`   因縁：${r.rivalry||"なし"}`]),"","【戦国記】",...st.chronicle.map(e=>`${e.date} ${e.text}`),"","【テスト確認】","・火守兼定が初陣後に退却した時、再戦したいと感じたか","・同じ敵将との二度目の戦いを一度目より意識したか","・名誉ある解放、臣従、屈辱のどれを選ぶか迷ったか","・敵将を単なる兵力ではなく人物として覚えられたか","・処遇の結果が次の戦いや戦国記につながったか"];const blob=new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`Project_Sengoku_v06_PlayReport_${Date.now()}.txt`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("プレイレポートを出力しました")}function showChronicle(){openModal(`<p class="k">YOUR SENGOKU CHRONICLE</p><h2>蒼月戦国記</h2>${st.chronicle.map(e=>`<div class="chron"><span>${e.date}</span><p>${e.text}</p></div>`).join("")}<div class="modalactions"><button id="chronClose" class="btn primary">閉じる</button></div>`);$("chronClose").onclick=closeModal}
function showIntro(){openModal(`<p class="k">PROLOGUE</p><h2>永禄元年、春</h2><p>蒼月家は清洲城ただ一城を残し、滅亡の危機にあった。</p><p>味方だけでなく、敵にも名と誇りがあります。同じ敵将と戦えば因縁が生まれ、敬意をもって解放するか、臣従を迫るか、屈辱を与えるかで、その後の歴史が変わります。</p><p>最初の鳴海砦攻略戦では、守将・火守兼定との出会いが始まります。彼は一度の敗北では終わりません。</p><div class="modalactions"><button id="introOk" class="btn primary">軍議を始める</button></div>`);$("introOk").onclick=closeModal}function showMenu(){openModal(`<p class="k">SYSTEM</p><h2>メニュー</h2><p>命令実行時と季節進行時に自動保存されます。 <span class="honor-pill">家名信用 ${st.houseHonor}</span></p><div class="modalactions"><button id="menuRetainers" class="btn secondary">家臣団</button><button id="menuLoyalty" class="btn secondary">忠誠評定</button><button id="menuRivals" class="btn secondary">因縁録</button><button id="menuBattles" class="btn secondary">合戦記録</button><button id="menuReport" class="btn secondary">プレイレポート出力</button><button id="menuChron" class="btn secondary">戦国記</button><button id="menuPrison" class="btn secondary">捕虜</button><button id="menuTitle" class="btn secondary">タイトルへ</button><button id="menuReset" class="btn danger">最初から</button><button id="menuClose" class="btn primary">戻る</button></div>`);$("menuRetainers").onclick=()=>showAllRetainers();$("menuLoyalty").onclick=showLoyaltyCouncil;$("menuRivals").onclick=showRivalArchive;$("menuBattles").onclick=showBattleArchive;$("menuReport").onclick=downloadPlayReport;$("menuChron").onclick=showChronicle;$("menuPrison").onclick=showPrisoners;$("menuTitle").onclick=()=>{closeModal();showTitle()};$("menuReset").onclick=()=>{st=initial();save();closeModal();render();showIntro()};$("menuClose").onclick=closeModal}function showAllRetainers(){const list=st.officers.filter(o=>o.faction===0&&o.status==="active").sort((a,b)=>loyaltyRisk(b)-loyaltyRisk(a));openModal(`<p class="k">ALL RETAINERS</p><h2>蒼月家 家臣団</h2><p>人物を選ぶと、忠誠、不満、野心、約束、生涯記録を確認できます。</p><div class="choices">${list.map(o=>`<button class="choice" data-all-retainer="${o.id}"><strong>${st.favoriteOfficerId===o.id?"★ ":""}${o.name} <span class="merit-pill">勲功${o.merit}</span> <span class="loyalty-risk ${loyaltyRiskClass(o)}">${loyaltyRiskLabel(o)}</span></strong><small>${o.role} / ${o.traits.join("・")} / 忠誠${o.loyalty} / 不満${o.grievance}</small></button>`).join("")}</div><div class="modalactions"><button id="allLoyalty" class="btn secondary">忠誠評定</button><button id="allClose" class="btn primary">閉じる</button></div>`);document.querySelectorAll("[data-all-retainer]").forEach(b=>b.onclick=()=>showOfficerDetail(b.dataset.allRetainer));$("allLoyalty").onclick=showLoyaltyCouncil;$("allClose").onclick=closeModal}
els.newBtn.onclick=()=>{st=initial();save();showGame();showIntro()};els.continueBtn.onclick=()=>{if(!load())return toast("セーブデータがありません");showGame()};els.menu.onclick=showMenu;els.chron.onclick=showChronicle;els.endTurn.onclick=endTurn;els.close.onclick=closeModal;els.modalBg.onclick=e=>{if(e.target===els.modalBg)closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});els.continueBtn.disabled=!(localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)||localStorage.getItem(OLDER_KEY)||localStorage.getItem(LEGACY_KEY)||localStorage.getItem(ANCIENT_KEY));render();
})();
